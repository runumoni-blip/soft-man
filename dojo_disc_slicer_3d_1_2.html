                gunGrp.add(barrel);
                const topRail = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.08, 1.05), accentMat);
                topRail.position.set(0, 0.28, -0.22);
                gunGrp.add(topRail);
                const muzzle = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.25, 14), accentMat);
                muzzle.rotation.x = Math.PI / 2;
                muzzle.position.set(0, 0.12, -0.9);
                gunGrp.add(muzzle);
                const grip = new THREE.Mesh(roundedBoxGeo(0.22, 0.55, 0.28, 0.05, 2), gripMat);
                grip.position.set(0, -0.2, 0.18);
                grip.rotation.x = 0.28;
                gunGrp.add(grip);
                // Muzzle flash star (visible briefly on shot)
                muzzleFlashMesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.35, 1), new THREE.MeshBasicMaterial({ color: C(0xfef08a), transparent: true, opacity: 0.95 }));
                muzzleFlashMesh.position.set(0, 0.12, -1.15);
                muzzleFlashMesh.visible = false;
                gunGrp.add(muzzleFlashMesh);
                readyDiscGroup.add(gunGrp);
                readyDiscGroup.rotation.set(0, 0, 0);
            } else {
                const mode = DISC_MODES[currentDiscModeIndex];
                const outer = new THREE.Mesh(
                    new THREE.CylinderGeometry(mode.radius * 0.75, mode.radius * 0.75, 0.08, 28),
                    new THREE.MeshStandardMaterial({ color: C(mode.color), emissive: C(mode.color), emissiveIntensity: 0.3, metalness: 0.5, roughness: 0.25 })
                );
                readyDiscGroup.add(outer);
                const inner = new THREE.Mesh(
                    new THREE.CylinderGeometry(mode.radius * 0.42, mode.radius * 0.42, 0.11, 22),
                    new THREE.MeshStandardMaterial({ color: C(mode.rimColor), roughness: 0.3 })
                );
                readyDiscGroup.add(inner);
            }
        }
        rebuildReadyDiscMesh();

        // Dotted Trajectory Preview Dots
        const trajectoryGroup = new THREE.Group();
        scene.add(trajectoryGroup);
        const trajectoryDots = [];
        const NUM_TRAJ_DOTS = 18;
        for (let i = 0; i < NUM_TRAJ_DOTS; i++) {
            const dot = new THREE.Mesh(
                new THREE.SphereGeometry(0.13 * (1 - i / (NUM_TRAJ_DOTS * 1.3)), 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 - (i / NUM_TRAJ_DOTS) * 0.65, depthWrite: false })
            );
            dot.visible = false;
            trajectoryGroup.add(dot);
            trajectoryDots.push(dot);
        }

        /* ============================================================================
         * LEVEL STATE
         * ============================================================================ */
        let levelBreakables = [];
        let levelActivity = null;
        let levelWorld = null;
        let levelPlan = null;
        const levelGroup = new THREE.Group();
        scene.add(levelGroup);
        let levelCompleteTimer = null;
        let levelStartTime = 0;
        let aimSettings = { yMin: 0.6, yMax: 3.3, z: -3.5 };
        let camTarget = { pos: baseCamPos.clone(), look: baseCamLookAt.clone() };

        const STORE_KEY = 'dojoDiscSlicer3D_v2';
        const progress = { level: 1, best: 1, kills: 0, stars: {}, muted: false };
        function loadProgress() {
            try {
                const raw = localStorage.getItem(STORE_KEY);
                if (raw) Object.assign(progress, JSON.parse(raw));
            } catch (e) { /* storage unavailable */ }
            progress.level = Math.max(1, Math.floor(progress.level || 1));
            progress.best = Math.max(progress.level, Math.floor(progress.best || 1));
        }
        function saveProgress() {
            try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) { /* ignore */ }
        }

        function clearLevelEntities() {
            if (levelCompleteTimer) { clearTimeout(levelCompleteTimer); levelCompleteTimer = null; }
            activeDiscs.forEach(d => d.destroyClean());
            activeDiscs = [];
            allCharacters.slice().forEach(c => c.dispose());
            physics.bodies.forEach(b => { if (b.obj) { scene.remove(b.obj); disposeTree(b.obj); } if (b.mesh) scene.remove(b.mesh); });
            physics.clear();
            physics.colliders = [];
            if (levelActivity && levelActivity.dispose) { try { levelActivity.dispose(); } catch (e) { console.warn(e); } }
            levelActivity = null;
            while (levelGroup.children.length) { const c = levelGroup.children[0]; levelGroup.remove(c); disposeTree(c); }
            // remove any stray physics-reparented objects
            scene.children.slice().forEach(o => { if (o.userData && o.userData.levelObject) { scene.remove(o); disposeTree(o); } });
            levelBreakables = [];
            clearEffects();
        }

        function showLevelIntro(plan) {
            const el = document.getElementById('level-intro');
            document.getElementById('level-intro-emoji').textContent = plan.emoji;
            document.getElementById('level-intro-title').textContent = plan.title.toUpperCase();
            document.getElementById('level-intro-world').textContent = `${plan.worldEmoji} ${plan.worldName}`;
            el.style.opacity = '1';
            clearTimeout(showLevelIntro.t);
            showLevelIntro.t = setTimeout(() => (el.style.opacity = '0'), 1700);
        }

        function loadLevel(levelNum) {
            clearLevelEntities();
            evictOldTextures();
            currentLevel = Math.max(1, Math.floor(levelNum));
            gameState = 'PLAYING';
            levelThrows = 0;
            comboCount = 0;
            updateThrowsHUD();
            document.getElementById('level-complete-modal').classList.add('hidden');
            document.getElementById('level-complete-modal').classList.remove('flex');
            document.getElementById('level-display').textContent = `Level ${currentLevel}`;

            const plan = getLevelPlan(currentLevel);
            levelPlan = plan;
            const rng = new RNG(plan.seed);
            levelWorld = buildWorld(plan.world, plan.variant, new RNG(plan.seed ^ 0x51ed));
            plan.worldName = levelWorld.name;
            levelActivity = buildActivity(plan, levelWorld, rng);

            document.getElementById('theme-badge').textContent = `${WORLDS[plan.world].emoji} ${levelWorld.name}`;
            document.getElementById('level-subtitle').textContent = `${plan.emoji} ${plan.title} — ${plan.desc}`;
            // camera & aim
            const cam = levelActivity.camera || {};
            camTarget.pos.set(...(cam.pos || [0, 4.3, 12.8]));
            camTarget.look.set(...(cam.look || [0, 2.0, -3.6]));
            baseCamPos.copy(camTarget.pos);
            camera.position.copy(camTarget.pos);
            camLookCurrent.copy(camTarget.look);
            camera.lookAt(camLookCurrent);
            aimSettings = Object.assign({ yMin: 0.6, yMax: 3.3, z: -3.5 }, levelActivity.aim || {});
            levelStartTime = gameTime;
            progress.level = currentLevel;
            progress.best = Math.max(progress.best, currentLevel);
            saveProgress();
            updateTargetsLeftHUD();
            showLevelIntro(plan);
            // warm up animation momentum so first-frame hits ragdoll correctly
            allCharacters.forEach(c => { c.update(1 / 60); c.update(1 / 60); });
            retireFrames = 3;
        }

        function updateTargetsLeftHUD() {
            const remaining = allCharacters.filter(e => e.alive).length;
            const el = document.getElementById('targets-left');
            if (el) el.textContent = remaining;
        }
        function updateThrowsHUD() {
            const el = document.getElementById('throws-count');
            if (el) el.textContent = levelThrows;
        }

        function starsFor(throws, targets) {
            if (throws <= targets) return 3;
            if (throws <= targets + Math.max(2, Math.ceil(targets * 0.6))) return 2;
            return 1;
        }

        function checkLevelCompletion() {
            updateTargetsLeftHUD();
            if (gameState !== 'PLAYING') return;
            const remaining = allCharacters.filter(e => e.alive).length;
            if (remaining === 0) {
                gameState = 'LEVEL_COMPLETE';
                const targets = allCharacters.length;
                const stars = starsFor(Math.max(1, levelThrows), targets);
                progress.stars[currentLevel] = Math.max(progress.stars[currentLevel] || 0, stars);
                progress.best = Math.max(progress.best, currentLevel + 1);
                progress.kills = totalKills;
                saveProgress();
                levelCompleteTimer = setTimeout(() => {
                    sound.playVictory();
                    const modal = document.getElementById('level-complete-modal');
                    const starEl = document.getElementById('modal-stars');
                    starEl.innerHTML = [0, 1, 2].map(i => `<span class="big-star ${i < stars ? 'star-on' : 'star-off'}" style="animation-delay:${0.15 + i * 0.18}s">★</span>`).join('');
                    [0, 1, 2].forEach(i => { if (i < stars) setTimeout(() => sound.playStar(i), 250 + i * 180); });
                    const caps = ['All targets sliced! Next stage awaits!', 'What a throw! Physics did the rest!', 'Splat-tastic! They never saw it coming!', 'Total chaos! The guys are flopping!'];
                    document.getElementById('modal-sub-caption').textContent = `${caps[currentLevel % caps.length]}  (${levelThrows} throw${levelThrows === 1 ? '' : 's'})`;
                    const next = getLevelPlan(currentLevel + 1);
                    document.getElementById('modal-next-preview').textContent = `Next — Level ${currentLevel + 1}: ${next.emoji} ${next.title} in ${WORLDS[next.world].emoji} ${WORLDS[next.world].name}`;
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                }, 1500);
            }
        }

        function updateScoreHUD() {
            document.getElementById('score-counter').textContent = totalKills;
        }

        /* ============================================================================
         * INPUT CONTROLS (Soft, responsive aiming via Drag OR Direct Tap/Click)
         * ============================================================================ */
        let isAiming = false;
        let aimStartScreen = { x: 0, y: 0 };
        let aimCurrentScreen = { x: 0, y: 0 };
        const raycaster = new THREE.Raycaster();
        const aimPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 2.5);

        // Ray vs capsule distance (for gentle aim assist)
        function rayCapsuleDistance(ray, cap, outPoint) {
            const segA = _v1.set(cap.ax, cap.ay, cap.az), segB = _v2.set(cap.bx, cap.by, cap.bz);
            const segPt = new THREE.Vector3(), rayPt = new THREE.Vector3();
            const dSq = ray.distanceSqToSegment(segA, segB, rayPt, segPt);
            if (outPoint) outPoint.copy(segPt);
            return Math.sqrt(dSq) - cap.r;
        }
        function screenToTargetWorld(clientX, clientY) {
            const ndcX = (clientX / window.innerWidth) * 2 - 1;
            const ndcY = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);
            // Aim assist: if the pointer is over (or very near) a guy, aim right at that body part
            let best = null, bestD = 0.55;
            const pt = new THREE.Vector3();
            allCharacters.forEach(ch => {
                if (!ch.alive) return;
                ch.capsules.forEach(cap => {
                    const d = rayCapsuleDistance(raycaster.ray, cap, pt);
                    if (d < bestD) { bestD = d; best = pt.clone(); }
                });
            });
            if (best) return best;
            // otherwise aim at a plane through the targets
            const alive = allCharacters.filter(c => c.alive);
            const zPlane = alive.length ? alive.reduce((s, c) => s + c.root.position.z, 0) / alive.length : aimSettings.z;
            aimPlane.set(new THREE.Vector3(0, 0, 1), -zPlane);
            const intersectPt = new THREE.Vector3();
            if (!raycaster.ray.intersectPlane(aimPlane, intersectPt)) intersectPt.set(ndcX * 8, 1.6, zPlane);
            intersectPt.x = THREE.MathUtils.clamp(intersectPt.x, -9, 9);
            intersectPt.y = THREE.MathUtils.clamp(intersectPt.y, aimSettings.yMin, aimSettings.yMax);
            return intersectPt;
        }

        function computeThrowVectors(clientX, clientY) {
            const mode = DISC_MODES[currentDiscModeIndex];
            const targetPt = screenToTargetWorld(clientX, clientY);
            if (isGunMode) {
                const dir = new THREE.Vector3().subVectors(targetPt, readyDiscPosition).normalize();
                const velocity = dir.multiplyScalar(78); // High-speed bullet velocity
                return { velocity, curveAccelX: 0 };
            }
            // Calculate horizontal drag offset for optional curve spin
            const dragDX = (clientX - aimStartScreen.x) / window.innerWidth;
            const curveAccelX = -dragDX * 18.0 * mode.curveFactor;
            const toT = new THREE.Vector3().subVectors(targetPt, readyDiscPosition);
            const dist = toT.length();
            const velocity = toT.normalize().multiplyScalar(mode.speed);
            // Compensate for gravity over the flight time (so the disc lands where you aim)
            const tf = dist / mode.speed;
            velocity.y += 0.5 * 1.8 * (physics.gravity / -22) * tf;
            // and pre-compensate the curve so the throw still ends at the target
            velocity.x -= 0.5 * curveAccelX * tf;
            return { velocity, curveAccelX };
        }

        function updateTrajectoryPreview(clientX, clientY) {
            const { velocity, curveAccelX } = computeThrowVectors(clientX, clientY);
            const grav = (isGunMode ? 0.25 : 1.8) * (physics.gravity / -22);
            const stepT = isGunMode ? 0.014 : 0.025;
            for (let i = 0; i < NUM_TRAJ_DOTS; i++) {
                const t = (i + 1) * stepT;
                const px = readyDiscPosition.x + velocity.x * t + 0.5 * curveAccelX * t * t;
                const py = Math.max(0.15, readyDiscPosition.y + velocity.y * t - 0.5 * grav * t * t);
                const pz = readyDiscPosition.z + velocity.z * t;
                trajectoryDots[i].position.set(px, py, pz);
                trajectoryDots[i].material.color.setHex(isGunMode ? 0xfef08a : 0xffffff);
                trajectoryDots[i].visible = true;
            }
        }

        function hideTrajectoryPreview() {
            trajectoryDots.forEach(d => (d.visible = false));
        }

        function launchDisc(clientX, clientY) {
            if (gameState !== 'PLAYING') return;
            const mode = DISC_MODES[currentDiscModeIndex];
            const { velocity, curveAccelX } = computeThrowVectors(clientX, clientY);
            levelThrows++;
            updateThrowsHUD();
            if (isGunMode) {
                sound.playGunshot();
                activeDiscs.push(new ThrownDisc(readyDiscPosition, velocity, 0, mode, true));
                // Gun recoil & muzzle flash
                readyDiscGroup.position.z = readyDiscPosition.z + 0.45;
                readyDiscGroup.rotation.x = 0.32;
                if (muzzleFlashMesh) {
                    muzzleFlashMesh.visible = true;
                    muzzleFlashTimer = 0.07;
                }
                cameraShake = 0.14;
                return;
            }
            sound.playThrow();
            if (mode.count === 1) {
                activeDiscs.push(new ThrownDisc(readyDiscPosition, velocity, curveAccelX, mode, false));
            } else {
                // Triple fan spread
                [-0.14, 0, 0.14].forEach(angleOffset => {
                    const spreadVel = velocity.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), angleOffset);
                    activeDiscs.push(new ThrownDisc(readyDiscPosition, spreadVel, curveAccelX, mode, false));
                });
            }
            // Brief visual recoil on ready disc
            readyDiscGroup.scale.setScalar(0.25);
        }

        // Pointer Down / Move / Up Listeners
        canvas.addEventListener('pointerdown', e => {
            sound.init();
            if (gameState !== 'PLAYING') return;
            isAiming = true;
            aimStartScreen = { x: e.clientX, y: e.clientY };
            aimCurrentScreen = { x: e.clientX, y: e.clientY };
            updateTrajectoryPreview(e.clientX, e.clientY);
        });

        let pointerNX = 0, pointerNY = 0;
        window.addEventListener('pointermove', e => {
            // Subtle parallax camera sway on pointer movement
            pointerNX = (e.clientX / window.innerWidth - 0.5) * 2;
            pointerNY = (e.clientY / window.innerHeight - 0.5) * 2;
            if (isGunMode) {
                const targetPt = screenToTargetWorld(e.clientX, e.clientY);
                readyDiscGroup.lookAt(targetPt);
            }
            if (!isAiming) return;
            aimCurrentScreen = { x: e.clientX, y: e.clientY };
            updateTrajectoryPreview(e.clientX, e.clientY);
        });

        window.addEventListener('pointerup', e => {
            if (!isAiming) return;
            isAiming = false;
            hideTrajectoryPreview();
            launchDisc(e.clientX, e.clientY);
        });
        window.addEventListener('pointercancel', () => { isAiming = false; hideTrajectoryPreview(); });

        /* ============================================================================
         * UI BUTTON HANDLERS
         * ============================================================================ */
        document.getElementById('btn-restart-top').addEventListener('click', () => {
            loadLevel(currentLevel);
        });
        document.getElementById('btn-prev-level').addEventListener('click', () => {

        document.getElementById('btn-next-level').addEventListener('click', () => {

        document.getElementById('btn-again').addEventListener('click', () => {

        // Level select (unlimited levels)

                    <div class="flex items-center justify-between"><span class="font-extrabold text-sm hud-level-text">Lv ${n}</span><span class="text-xs">${[0, 1, 2].map(i => `<span class="${i < st ? 'star-on' : 'star-off'}">★</span>`).join('')}</span></div>
                    <div class="text-2xl leading-tight mt-0.5">${p.emoji}</div>

        function closeLevelSelect() {

            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
        document.getElementById('btn-levels').addEventListener('click', openLevelSelect);

        document.getElementById('btn-goto-level').addEventListener('click', () => {

        document.getElementById('input-goto-level').addEventListener('keydown', e => {

        function updateWeaponHUDText() {
            const mode = DISC_MODES[currentDiscModeIndex];
            const weaponBadge = document.getElementById('weapon-mode-badge');
            if (isGunMode) {
                weaponBadge.textContent = 'GUN';

        document.getElementById('btn-weapon-gun').addEventListener('click', () => {
            isGunMode = !isGunMode;
            updateWeaponHUDText();
            rebuildReadyDiscMesh();
            if (isGunMode) {
                sound.playGunshot();
            } else {
                sound.playThrow();
            }
        });

        function applyMuteUI() {
            document.getElementById('icon-sound-on').classList.toggle('hidden', sound.muted);
            document.getElementById('icon-sound-off').classList.toggle('hidden', !sound.muted);
        }
        document.getElementById('btn-mute').addEventListener('click', () => {
            sound.muted = !sound.muted;
            progress.muted = sound.muted;
            saveProgress();
            applyMuteUI();
        });
        window.addEventListener('keydown', e => {
            if (e.key === 'r' || e.key === 'R') loadLevel(currentLevel);
            else if (e.key === 'n' || e.key === 'N' || e.key === 'ArrowRight') loadLevel(currentLevel + 1);
            else if (e.key === 'p' || e.key === 'P' || e.key === 'ArrowLeft') loadLevel(Math.max(1, currentLevel - 1));
        });

        /* ============================================================================
         * MAIN PHYSICS & RENDER LOOP
         * ============================================================================ */
        let lastTime = performance.now();
        let retireFrames = 0;
        const _camLook = new THREE.Vector3();

        // Adaptive quality: on slow devices lower the render resolution (then shadow detail)
        // so the game always stays smooth and soft to play.
        const perfMon = { t: -5, acc: 0, n: 0, steps: 0 };   // ignore the first seconds (shader warm-up)
        function adaptQuality(rawDt) {
            if (document.hidden) return;
            if (perfMon.t < 0) { perfMon.t += rawDt; return; }
            perfMon.t += rawDt; perfMon.acc += rawDt; perfMon.n++;
            if (perfMon.t < 3) return;
            const avg = perfMon.acc / perfMon.n;
            perfMon.t = 0; perfMon.acc = 0; perfMon.n = 0;
            if (avg < 1 / 45 || perfMon.steps >= 3) return;
            perfMon.steps++;
            const pr = renderer.getPixelRatio();
            if (pr > 1.01) {
                renderer.setPixelRatio(Math.max(1, pr - 0.35));
                renderer.setSize(window.innerWidth, window.innerHeight);
            } else if (sunLight.shadow.mapSize.width > 1024) {
                sunLight.shadow.mapSize.set(1024, 1024);
                if (sunLight.shadow.map) { sunLight.shadow.map.dispose(); sunLight.shadow.map = null; }
            }
        }

        function animate(now) {
            requestAnimationFrame(animate);

            const rawDt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;
            adaptQuality(rawDt);

            // Handle impact slow-motion
            if (slowMoTimer > 0) {
                slowMoTimer -= rawDt;
                if (slowMoTimer <= 0) slowMoFactor = 1.0;
            }
            const dt = rawDt * slowMoFactor;
            gameTime += dt;
            if (comboTimer > 0) comboTimer -= rawDt;

            // Camera: smooth follow of the activity framing + parallax sway + shake
            _camLook.copy(camTarget.pos);
            _camLook.x += pointerNX * 0.55;
            _camLook.y -= pointerNY * 0.25;
            camera.position.lerp(_camLook, 0.06);
            if (cameraShake > 0) {
                cameraShake = Math.max(0, cameraShake - rawDt * 1.8);
                camera.position.x += (Math.random() - 0.5) * cameraShake;
                camera.position.y += (Math.random() - 0.5) * cameraShake;
            }
            camLookCurrent.lerp(camTarget.look, 0.08);
            camera.lookAt(camLookCurrent);
            skyDome.position.copy(camera.position);
            skyUniforms.time.value = gameTime;

            // Animate player's ready disc or 3D gun in foreground
            if (isGunMode) {
                readyDiscGroup.position.lerp(readyDiscPosition, 0.2);
                readyDiscGroup.rotation.x = THREE.MathUtils.lerp(readyDiscGroup.rotation.x, 0, 0.2);
                if (muzzleFlashTimer > 0) {
                    muzzleFlashTimer -= rawDt;
                    if (muzzleFlashTimer <= 0 && muzzleFlashMesh) muzzleFlashMesh.visible = false;
                }
            } else {
                readyDiscGroup.position.copy(readyDiscPosition);
                readyDiscGroup.rotation.set(0, readyDiscGroup.rotation.y + rawDt * 8.5, 0);
            }
            readyDiscGroup.scale.lerp(_v1.set(1, 1, 1), 0.15);

            // World ambience (petals / snow / embers, water waves, clouds, disco lights...)
            updateAmbient(rawDt, gameTime);
            updateWater(gameTime);
            for (let i = 0; i < worldUpdaters.length; i++) worldUpdaters[i](dt, gameTime);

            // 1. Activities (contraptions) & characters
            if (levelActivity) levelActivity.update(dt, gameTime);
            for (let i = 0; i < allCharacters.length; i++) allCharacters[i].update(dt);

            // 2. Update Active Thrown Discs
            for (let i = activeDiscs.length - 1; i >= 0; i--) {
                const d = activeDiscs[i];
                d.update(dt);
                d.updateTrail(rawDt);
                if (!d.active && d.trailMeshes.length === 0) activeDiscs.splice(i, 1);
            }

            // 3. Physics world: ragdolls, severed parts, props, food, debris, ropes
            physics.step(dt);

            // 4. Splatter, confetti, puddles
            updateEffects(dt);

            renderer.render(scene, camera);
            // release the previous level's materials once the new level has been drawn
            if (retireFrames > 0) { if (--retireFrames === 0) flushRetiredMaterials(); }
            else if (_matGraveyard.length > 60) flushRetiredMaterials();
        }

        window.onload = function () {
            loadProgress();
            totalKills = progress.kills || 0;
            sound.muted = !!progress.muted;
            applyMuteUI();
            updateScoreHUD();
            updateWeaponHUDText();
            loadLevel(progress.level || 1);
            lastTime = performance.now();
            animate(lastTime);
        };
    </script>
</body>
</html>
