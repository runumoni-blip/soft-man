<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dojo Disc Slicer 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #68e1fd;
            font-family: 'Fredoka', sans-serif;
            touch-action: none;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        /* Stroke text matching the video HUD */
        .hud-level-text {
            font-family: 'Fredoka', sans-serif;
            font-weight: 800;
            color: #ffffff;
            text-shadow:
                -2px -2px 0 #1f2937,
                 2px -2px 0 #1f2937,
                -2px  2px 0 #1f2937,
                 2px  2px 0 #1f2937,
                 0px  3px 0 #111827;
            letter-spacing: 0.5px;
        }
        /* Comic 3D Level Complete Title */
        .level-complete-title {
            font-family: 'Luckiest Guy', cursive;
            color: #ffdd00;
            letter-spacing: 2px;
            line-height: 0.95;
            text-align: center;
            text-shadow:
                -3px -3px 0 #1e1b4b,
                 3px -3px 0 #1e1b4b,
                -3px  3px 0 #1e1b4b,
                 3px  3px 0 #1e1b4b,
                 0px  4px 0 #312e81,
                 0px  7px 0 #3730a3,
                 0px 10px 0 #1e1b4b,
                 0px 14px 20px rgba(0,0,0,0.45);
            transform: rotate(-3deg);
            animation: popBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes popBounce {
            0% { transform: scale(0.2) rotate(-10deg); opacity: 0; }
            70% { transform: scale(1.08) rotate(-2deg); opacity: 1; }
            100% { transform: scale(1) rotate(-3deg); opacity: 1; }
        }
        /* Glossy Action Buttons ("Again" & "Continue") */
        .btn-game-orange {
            background: linear-gradient(180deg, #ffbe3b 0%, #f59e0b 100%);
            border: 3px solid #ffffff;
            box-shadow: 0 5px 0 #b45309, 0 8px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-game-orange:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b45309, 0 3px 6px rgba(0,0,0,0.25);
        }
        .btn-game-green {
            background: linear-gradient(180deg, #34d399 0%, #10b981 55%, #059669 100%);
            border: 3px solid #ffffff;
            box-shadow: 0 5px 0 #065f46, 0 8px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-game-green:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #065f46, 0 3px 6px rgba(0,0,0,0.25);
        }
        /* Left-side Blue Power Button */
        .btn-blue-power {
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            border: 3px solid #7dd3fc;
            box-shadow: 0 5px 0 #0369a1, 0 8px 15px rgba(0,0,0,0.25);
            transition: all 0.15s ease;
        }
        .btn-blue-power:hover {
            transform: translateY(-2px) scale(1.04);
        }
        .btn-blue-power:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #0369a1;
        }
        /* Floating Hit Feedback */
        .hit-popup {
            position: absolute;
            pointer-events: none;
            font-family: 'Luckiest Guy', cursive;
            font-size: 1.7rem;
            color: #4ade80;
            text-shadow: -2px -2px 0 #064e3b, 2px -2px 0 #064e3b, -2px 2px 0 #064e3b, 2px 2px 0 #064e3b, 0 4px 8px rgba(0,0,0,0.3);
            animation: floatUpFade 0.85s ease-out forwards;
            z-index: 30;
            white-space: nowrap;
        }
        .hit-popup.voice {
            font-size: 1.25rem;
            color: #fde047;
            text-shadow: -2px -2px 0 #7c2d12, 2px -2px 0 #7c2d12, -2px 2px 0 #7c2d12, 2px 2px 0 #7c2d12, 0 4px 8px rgba(0,0,0,0.3);
            animation-duration: 1.1s;
        }
        @keyframes floatUpFade {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            35% { transform: translate(-50%, -90%) scale(1.15); opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(0.9); opacity: 0; }
        }
        /* Level select tiles */
        .level-tile {
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            box-shadow: 0 4px 0 rgba(15,23,42,0.55);
        }
        .level-tile:hover { transform: translateY(-2px); }
        .level-tile:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(15,23,42,0.55); }
        .level-tile.locked { filter: grayscale(0.85) brightness(0.8); }
        .star-on { color: #fde047; text-shadow: 0 2px 0 #92400e, 0 0 10px rgba(253,224,71,0.7); }
        .star-off { color: rgba(255,255,255,0.28); }
        .big-star { display: inline-block; animation: starPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
        @keyframes starPop {
            0% { transform: scale(0) rotate(-40deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        #level-grid::-webkit-scrollbar { width: 8px; }
        #level-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.35); border-radius: 8px; }
        .loading-fade { transition: opacity 0.35s ease; }
    </style>
</head>
<body class="relative select-none overflow-hidden">

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="w-full h-full relative">
        <canvas id="game-canvas"></canvas>
    </div>

    <!-- Top HUD Bar -->
    <div class="fixed top-0 left-0 right-0 p-3 sm:p-5 flex justify-between items-start pointer-events-none z-20">
        <!-- Top-Left: Level Indicator + Hint -->
        <div class="flex flex-col gap-1.5">
            <div class="flex flex-wrap items-center gap-1.5 pointer-events-auto max-w-[72vw]">
                <button id="btn-prev-level" title="Previous Level" class="w-7 h-7 rounded-full bg-slate-900/80 text-white font-extrabold text-sm flex items-center justify-center border border-white/30 hover:bg-slate-800 active:scale-90 transition">
                    &lt;
                </button>
                <div id="level-display" class="hud-level-text text-2xl sm:text-3xl mr-1">Level 1</div>
                <button id="btn-next-level" title="Next Level" class="w-7 h-7 rounded-full bg-slate-900/80 text-white font-extrabold text-sm flex items-center justify-center border border-white/30 hover:bg-slate-800 active:scale-90 transition">
                    &gt;
                </button>
                <button id="btn-levels" title="All Levels" class="bg-yellow-400 hover:bg-yellow-300 text-slate-950 text-[11px] font-extrabold px-2.5 py-0.5 rounded-full border-2 border-slate-900 shadow active:scale-95 transition">
                    &#9776; Levels
                </button>
                <span id="theme-badge" class="bg-slate-900/75 text-amber-300 text-xs font-extrabold px-2.5 py-0.5 rounded-full border border-white/25 shadow backdrop-blur-sm">
                    Sakura Dojo
                </span>
            </div>
            <div id="level-subtitle" class="text-xs sm:text-sm font-bold text-slate-800 bg-white/85 backdrop-blur-sm px-3 py-1 rounded-full shadow-sm border border-white/60 w-fit max-w-[70vw]">
                Drag to Curve &amp; Aim &bull; Hit Any Body Part!
            </div>
        </div>

        <!-- Top-Right: Kill Counter Badge & Reset Button -->
        <div class="flex flex-col items-end gap-2.5 pointer-events-auto">
            <!-- Score / Head Counter Pill -->
            <div class="bg-white border-[2.5px] border-slate-800 rounded-full px-3 py-1 flex items-center gap-3 shadow-md min-w-[92px] justify-between">
                <!-- Green Pouty-Lips Googly Head SVG Icon -->
                <svg class="w-6 h-6 shrink-0" viewBox="0 0 36 36" fill="none">
                    <circle cx="18" cy="18" r="14" fill="#52d411" stroke="#1e293b" stroke-width="2.5"/>
                    <circle cx="12.5" cy="14.5" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
                    <circle cx="12.8" cy="14.5" r="2.3" fill="#0f172a"/>
                    <circle cx="23.5" cy="14.5" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
                    <circle cx="23.2" cy="14.5" r="2.3" fill="#0f172a"/>
                    <ellipse cx="18" cy="24" rx="5.5" ry="3.4" fill="#ff2e7e" stroke="#1e293b" stroke-width="1.5"/>
                    <line x1="13.5" y1="24" x2="22.5" y2="24" stroke="#881337" stroke-width="1.4"/>
                </svg>
                <span id="score-counter" class="font-extrabold text-slate-900 text-lg pr-1">0</span>
            </div>

            <!-- Remaining Enemies Pill -->
            <div class="bg-slate-900/80 text-white border border-white/25 rounded-full px-3 py-0.5 text-xs font-bold shadow">
                Targets Left: <span id="targets-left" class="text-emerald-400 font-extrabold">3</span>
            </div>
            <div class="bg-slate-900/70 text-white border border-white/20 rounded-full px-3 py-0.5 text-[11px] font-bold shadow">
                Throws: <span id="throws-count" class="text-sky-300 font-extrabold">0</span>
            </div>

            <!-- Circular Restart Level Button + Audio Button -->
            <div class="flex items-center gap-2">
                <button id="btn-mute" title="Toggle Sound" class="w-10 h-10 rounded-full bg-white border-[2.5px] border-slate-800 flex items-center justify-center shadow-md hover:scale-105 active:scale-95 transition">
                    <svg id="icon-sound-on" class="w-5 h-5 text-slate-800" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/>
                    </svg>
                    <svg id="icon-sound-off" class="w-5 h-5 text-red-500 hidden" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM22 9l-6 6M16 9l6 6"/>
                    </svg>
                </button>
                <button id="btn-restart-top" title="Restart Level" class="w-10 h-10 rounded-full bg-white border-[2.5px] border-slate-800 flex items-center justify-center shadow-md hover:scale-105 active:scale-95 transition">
                    <svg class="w-5 h-5 text-slate-800" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom-Left Gun / Disc Toggle Button -->
    <div class="fixed bottom-10 left-3 sm:left-5 z-20 flex items-center gap-3">
        <!-- Gun Weapon Toggle Button -->
        <button id="btn-weapon-gun" class="btn-game-orange w-14 h-14 sm:w-16 sm:h-16 rounded-2xl flex flex-col items-center justify-center text-white relative group">
            <!-- Stylized Handgun SVG Icon -->
            <svg class="w-8 h-8 drop-shadow text-slate-900" viewBox="0 0 24 24" fill="currentColor">
                <path d="M2 7h15l2 2h3v4h-3.5l-1.5 1.5V16h-4v-1.5H9.5L7.5 20H3.5l1.5-5.5H2V7zm12 5.5v1.5h1.5v-1.5H14z"/>
            </svg>
            <span id="weapon-mode-badge" class="absolute -top-2 -right-2 bg-rose-500 text-white text-[10px] font-extrabold px-1.5 py-0.5 rounded-full border border-slate-900 shadow">
                DISC
            </span>
        </button>

        <div id="power-tooltip" class="bg-slate-900/80 backdrop-blur-md text-white text-xs font-bold px-3 py-1.5 rounded-xl border border-white/15 shadow-lg pointer-events-none">
            <div class="text-sky-300" id="disc-mode-title">Dojo Disc (Disc Mode)</div>
            <div class="text-white/80 text-[11px]" id="disc-mode-desc">Tap Gun icon to switch to Blaster Gun!</div>
        </div>
    </div>

    <!-- Bottom-Left Version Watermark (like 1.0.0 in video) -->
    <div class="fixed bottom-1.5 left-2 text-[11px] font-bold text-white/80 drop-shadow pointer-events-none z-10">
        2.0.0
    </div>

    <!-- Floating Hit Container -->
    <div id="floating-fx-container" class="fixed inset-0 pointer-events-none z-30"></div>

    <!-- Level intro banner -->
    <div id="level-intro" class="fixed inset-x-0 top-[26%] z-30 flex flex-col items-center pointer-events-none opacity-0 loading-fade">
        <div id="level-intro-emoji" class="text-5xl sm:text-6xl drop-shadow-lg">🕺</div>
        <div id="level-intro-title" class="level-complete-title text-3xl sm:text-5xl mt-1">DANCE PARTY</div>
        <div id="level-intro-world" class="mt-3 text-white font-extrabold text-sm sm:text-base bg-slate-900/75 px-4 py-1 rounded-full border border-white/20 shadow-lg">Disco Club</div>
    </div>

    <!-- LEVEL COMPLETE OVERLAY (Exact match to 0:04-0:05 in video) -->
    <div id="level-complete-modal" class="fixed inset-0 z-40 hidden flex-col items-center justify-between py-12 sm:py-16 bg-black/25 backdrop-blur-[2px]">
        <!-- Top Comic Title -->
        <div class="mt-2 sm:mt-4 flex flex-col items-center">
            <h1 id="modal-main-title" class="level-complete-title text-5xl sm:text-6xl md:text-7xl select-none">
                LEVEL<br>COMPLETE
            </h1>
            <div id="modal-stars" class="mt-4 text-5xl sm:text-6xl tracking-widest"></div>
            <p id="modal-sub-caption" class="mt-3 text-white font-extrabold text-sm sm:text-base bg-slate-900/80 px-4 py-1 rounded-full border border-white/20 shadow-lg text-center max-w-[90vw]">
                All targets sliced! Next stage awaits!
            </p>
            <p id="modal-next-preview" class="mt-2 text-amber-200 font-extrabold text-xs sm:text-sm bg-slate-900/70 px-3 py-1 rounded-full border border-white/15 shadow text-center max-w-[90vw]"></p>
        </div>

        <!-- Center Action Buttons ("Again" & "Continue") -->
        <div class="flex flex-col items-center gap-3.5 mb-20 sm:mb-24 w-56">
            <button id="btn-again" class="btn-game-orange w-44 py-2.5 rounded-full text-white font-extrabold text-xl flex items-center justify-center gap-2 tracking-wide">
                <span>Again</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
            </button>
            <button id="btn-continue" class="btn-game-green w-52 py-3 rounded-full text-white font-extrabold text-2xl flex items-center justify-center gap-2 tracking-wide">
                <span>Continue</span>
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- LEVEL SELECT OVERLAY (unlimited levels) -->
    <div id="level-select-modal" class="fixed inset-0 z-50 hidden flex-col items-center bg-slate-950/70 backdrop-blur-sm p-3 sm:p-6">
        <div class="w-full max-w-3xl flex flex-col h-full">
            <div class="flex items-center justify-between gap-3 mb-3">
                <h2 class="level-complete-title text-3xl sm:text-4xl" style="transform: rotate(-2deg);">LEVELS</h2>
                <button id="btn-close-levels" class="w-10 h-10 rounded-full bg-white border-[2.5px] border-slate-800 text-slate-900 font-extrabold text-lg shadow-md active:scale-95">&#10005;</button>
            </div>
            <div class="flex flex-wrap items-center gap-2 mb-3 bg-slate-900/70 rounded-2xl px-3 py-2 border border-white/15">
                <span class="text-white font-bold text-sm">Unlimited levels &mdash; go to level:</span>
                <input id="input-goto-level" type="number" min="1" step="1" value="1" class="w-24 rounded-full px-3 py-1 font-extrabold text-slate-900 border-2 border-slate-800 outline-none" style="user-select: text; -webkit-user-select: text;">
                <button id="btn-goto-level" class="btn-game-green px-4 py-1 rounded-full text-white font-extrabold text-sm">Play</button>
                <span class="text-white/70 text-xs font-bold ml-auto">Best: Level <span id="best-level-label">1</span></span>
            </div>
            <div id="level-grid" class="flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5 pr-1 pb-4"></div>
        </div>
    </div>

    <script>
        /* ============================================================================
         * UTILITIES: seeded random numbers, math helpers, color helpers
         * ============================================================================ */
        const TAU = Math.PI * 2;
        function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function smoothstep(a, b, x) {
            const t = clamp((x - a) / (b - a), 0, 1);
            return t * t * (3 - 2 * t);
        }
        function gauss(x, mu, sigma) { const d = (x - mu) / sigma; return Math.exp(-d * d); }
        function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
        function wrap01(x) { return x - Math.floor(x); }
        function mod(a, n) { return ((a % n) + n) % n; }
        // Smooth periodic pulse 0..1 (good for rhythmic dance & work motions)
        function pulse(t, sharp = 2) { return Math.pow((Math.sin(t) + 1) * 0.5, sharp); }

        // Deterministic seeded random generator (mulberry32) so every level number
        // always rebuilds the exact same unique level.
        class RNG {
            constructor(seed) { this.s = (seed >>> 0) || 0x9e3779b9; }
            next() {
                let t = (this.s = (this.s + 0x6D2B79F5) | 0);
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            }
            float(a = 0, b = 1) { return a + (b - a) * this.next(); }
            int(a, b) { return Math.floor(a + (b - a + 1) * this.next()); }
            pick(arr) { return arr[Math.floor(this.next() * arr.length) % arr.length]; }
            chance(p) { return this.next() < p; }
            sign() { return this.next() < 0.5 ? -1 : 1; }
            shuffle(arr) {
                const a = arr.slice();
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(this.next() * (i + 1));
                    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
                }
                return a;
            }
        }
        function hashSeed(...nums) {
            let h = 2166136261 >>> 0;
            nums.forEach(n => {
                const s = String(n);
                for (let i = 0; i < s.length; i++) {
                    h ^= s.charCodeAt(i);
                    h = Math.imul(h, 16777619) >>> 0;
                }
            });
            return h >>> 0;
        }
        // Non-deterministic cosmetic randomness (effects only)
        function rand(a = 0, b = 1) { return a + (b - a) * Math.random(); }

        // All material colors are authored in sRGB hex and converted to the linear
        // working space used by the physically based renderer.
        function C(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }
        function hslHex(h, s, l) { const c = new THREE.Color(); c.setHSL(wrap01(h), clamp(s, 0, 1), clamp(l, 0, 1)); return c.getHex(); }
        function shadeHex(hex, f) {
            const c = new THREE.Color(hex);
            if (f >= 1) c.lerp(new THREE.Color(0xffffff), clamp(f - 1, 0, 1));
            else c.multiplyScalar(f);
            return c.getHex();
        }
        function mixHex(a, b, t) { return new THREE.Color(a).lerp(new THREE.Color(b), t).getHex(); }
        function cssHex(hex) { return '#' + new THREE.Color(hex).getHexString(); }

        // Shared scratch objects (never hold references to these across calls)
        const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3(), _v4 = new THREE.Vector3();
        const _q1 = new THREE.Quaternion(), _q2 = new THREE.Quaternion();
        const _m1 = new THREE.Matrix4(), _m2 = new THREE.Matrix4();
        const AXIS_X = new THREE.Vector3(1, 0, 0), AXIS_Y = new THREE.Vector3(0, 1, 0), AXIS_Z = new THREE.Vector3(0, 0, 1);

        /* ============================================================================
         * GEOMETRY HELPERS: merging, rounded boxes, lathes, capsules, canvas textures
         * ============================================================================ */
        // Merge BufferGeometries (indexed or not) into one indexed geometry.
        function mergeGeometries(list) {
            const geos = list.filter(Boolean).map(g => (g.index ? g : indexify(g)));
            const attrNames = Object.keys(geos[0].attributes);
            let vCount = 0, iCount = 0;
            geos.forEach(g => { vCount += g.attributes.position.count; iCount += g.index.count; });
            const out = new THREE.BufferGeometry();
            attrNames.forEach(name => {
                const itemSize = geos[0].attributes[name].itemSize;
                const ArrayType = geos[0].attributes[name].array.constructor;
                const arr = new ArrayType(vCount * itemSize);
                let off = 0;
                geos.forEach(g => {
                    const a = g.attributes[name];
                    if (a) arr.set(a.array.subarray(0, a.count * itemSize), off);
                    off += g.attributes.position.count * itemSize;
                });
                out.setAttribute(name, new THREE.BufferAttribute(arr, itemSize));
            });
            const IndexType = vCount > 65535 ? Uint32Array : Uint16Array;
            const idx = new IndexType(iCount);
            let vOff = 0, iOff = 0;
            geos.forEach(g => {
                const ia = g.index.array;
                for (let i = 0; i < g.index.count; i++) idx[iOff + i] = ia[i] + vOff;
                vOff += g.attributes.position.count;
                iOff += g.index.count;
            });
            out.setIndex(new THREE.BufferAttribute(idx, 1));
            return out;
        }
        function indexify(g) {
            const n = g.attributes.position.count;
            const idx = [];
            for (let i = 0; i < n; i++) idx.push(i);
            g.setIndex(idx);

                f.frequency.exponentialRampToValueAtTime(120, now + 0.9);
                const g = this.ctx.createGain();
                g.gain.setValueAtTime(0.9, now);
                g.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
                n.connect(f); f.connect(g); g.connect(this.out);
                n.start(now, Math.random() * 0.5); n.stop(now + 1.05);
                const o = this.ctx.createOscillator();
                const og = this.ctx.createGain();
                o.type = 'sine';
                o.frequency.setValueAtTime(90, now);
                o.frequency.exponentialRampToValueAtTime(28, now + 0.6);
                og.gain.setValueAtTime(0.8, now);
                og.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
                o.connect(og); og.connect(this.out);
                o.start(now); o.stop(now + 0.7);
            }

            playRicochet() {
                if (!this.ready()) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(980, now);
                osc.frequency.exponentialRampToValueAtTime(1750, now + 0.08);
                osc.frequency.exponentialRampToValueAtTime(520, now + 0.22);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.23);

                osc.connect(gain);
                gain.connect(this.out);
                osc.start(now);
                osc.stop(now + 0.24);
            }

            playDefeat() {
                if (!this.ready()) return;
                const notes = [392.0, 349.23, 311.13, 261.63];
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + idx * 0.11;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.connect(gain);
                    gain.connect(this.out);
                    osc.start(now);
                    osc.stop(now + 0.32);
                });
            }

            playVictory() {
                if (!this.ready()) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + idx * 0.09;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.connect(gain);
                    gain.connect(this.out);
                    osc.start(now);
                    osc.stop(now + 0.36);
                });
            }

            playStar(idx = 0) {
                if (!this.ready()) return;
                const now = this.ctx.currentTime;
                const base = [880, 1108.7, 1318.5][idx % 3];
                [1, 2.01].forEach((m, k) => {
                    const o = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    o.type = k === 0 ? 'triangle' : 'sine';
                    o.frequency.setValueAtTime(base * m, now);
                    g.gain.setValueAtTime(k === 0 ? 0.16 : 0.06, now);
                    g.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                    o.connect(g); g.connect(this.out);
                    o.start(now); o.stop(now + 0.5);
                });
            }

            playNoiseBurst(dur = 0.1, freq = 1000, type = 'bandpass', amp = 0.3, q = 1, when = 0) {
                if (!this.ready()) return;
                const now = this.ctx.currentTime + when;
                const n = this.noiseSource();
                const f = this.ctx.createBiquadFilter();
                f.type = type;
                f.frequency.setValueAtTime(freq, now);
                f.Q.setValueAtTime(q, now);
                const g = this.ctx.createGain();
                g.gain.setValueAtTime(0.0001, now);
                g.gain.linearRampToValueAtTime(amp, now + Math.min(0.01, dur * 0.2));
                g.gain.exponentialRampToValueAtTime(0.0008, now + dur);
                n.connect(f); f.connect(g); g.connect(this.out);
                n.start(now, Math.random() * 0.5);
                n.stop(now + dur + 0.02);
            }

            /* ---------------------- FUNNY MOUTH VOICES ---------------------- */
            // Returns a lip-sync track {dur, sample(t) -> {open, round, wide}} even when muted
            voiceTrack(kind, pitch = 1, speed = 1) {
                const def = VOICE_LINES[kind] || VOICE_LINES.oof;
                if (def.raspberry) {
                    const dur = def.dur / speed;
                    return { dur, label: def.label, sample: t => { const k = clamp(t / dur, 0, 1); return { open: 0.12 + 0.08 * Math.sin(t * 190), round: 0.9, wide: 0.0, amp: 1 - k }; } };
                }
                const segs = def.segs;
                let total = 0;
                segs.forEach(s => (total += s.d));
                const dur = total / speed;
                return {
                    dur, label: def.label,
                    sample: t => {
                        let tt = t * speed, acc = 0;
                        for (let i = 0; i < segs.length; i++) {
                            const s = segs[i];
                            if (tt <= acc + s.d || i === segs.length - 1) {
                                const k = clamp((tt - acc) / s.d, 0, 1);
                                const m0 = VOWEL_MOUTH[s.v[0]], m1 = VOWEL_MOUTH[s.v[1]];
                                let amp = lerp(s.a[0], s.a[1], k);
                                if (s.am) amp *= 0.55 + 0.45 * Math.sin(tt * s.am * TAU);
                                return { open: lerp(m0.open, m1.open, k) * amp, round: lerp(m0.round, m1.round, k), wide: lerp(m0.wide, m1.wide, k), amp };
                            }
                            acc += s.d;
                        }
                        return { open: 0, round: 0, wide: 0, amp: 0 };
                    }
                };
            }

            playVoice(kind, pitch = 1, vol = 1, speed = 1) {
                const track = this.voiceTrack(kind, pitch, speed);
                if (!this.ready()) return track;
                const def = VOICE_LINES[kind] || VOICE_LINES.oof;
                const now = this.ctx.currentTime + 0.005;
                if (def.raspberry) { this.playRaspberry(now, pitch, vol, def.dur / speed); return track; }

                // Glottal source (bright sawtooth) with slight jitter for a natural "mouth" tone
                const src = this.ctx.createOscillator();
                src.type = 'sawtooth';
                const out = this.ctx.createGain();
                out.gain.setValueAtTime(0.0001, now);
                const soften = this.ctx.createBiquadFilter();
                soften.type = 'lowpass';
                soften.frequency.value = 4200;
                soften.Q.value = 0.5;
                out.connect(soften);
                soften.connect(this.out);

                // Three parallel formant band-pass filters (F1, F2, F3)
                const fq = [7, 11, 14];
                const fg = [1.0, 0.55, 0.28];
                const formants = fq.map((q, i) => {
                    const bp = this.ctx.createBiquadFilter();
                    bp.type = 'bandpass';
                    bp.Q.value = q;
                    const g = this.ctx.createGain();
                    g.gain.value = fg[i] * 3.2;
                    src.connect(bp); bp.connect(g); g.connect(out);
                    return bp;
                });
                // Breathy aspiration
                const breath = this.noiseSource();
                const bf = this.ctx.createBiquadFilter();
                bf.type = 'bandpass'; bf.frequency.value = 1600; bf.Q.value = 0.7;
                const bg = this.ctx.createGain(); bg.gain.value = 0.06;
                breath.connect(bf); bf.connect(bg); bg.connect(out);

                // Vibrato / tremolo LFOs
                const vib = this.ctx.createOscillator();
                vib.frequency.value = 6.5;
                const vibGain = this.ctx.createGain();
                vibGain.gain.value = 0;
                vib.connect(vibGain); vibGain.connect(src.frequency);

                let t = now;
                const pf = pitch * speed > 0 ? pitch : 1;
                const formantScale = 1 + (pitch - 1) * 0.35; // higher voices = slightly smaller mouths
                src.frequency.setValueAtTime(def.segs[0].f[0] * pf, t);
                def.segs[0].v && VOWELS[def.segs[0].v[0]].forEach((F, i) => formants[i].frequency.setValueAtTime(F * formantScale, t));
                def.segs.forEach(s => {
                    const d = s.d / speed;
                    const v0 = VOWELS[s.v[0]], v1 = VOWELS[s.v[1]];
                    src.frequency.setValueAtTime(Math.max(40, s.f[0] * pf), t);
                    src.frequency.exponentialRampToValueAtTime(Math.max(40, s.f[1] * pf), t + d);
                    for (let i = 0; i < 3; i++) {
                        formants[i].frequency.setValueAtTime(v0[i] * formantScale, t);
                        formants[i].frequency.linearRampToValueAtTime(v1[i] * formantScale, t + d);
                    }
                    const a0 = Math.max(0.0001, s.a[0] * 0.5 * vol), a1 = Math.max(0.0001, s.a[1] * 0.5 * vol);
                    out.gain.setValueAtTime(a0, t);
                    if (s.am) {
                        // Lip flap "blblbl": chop the amplitude
                        const steps = Math.floor(d * s.am);
                        for (let k = 0; k < steps; k++) {
                            const tk = t + (k / s.am);
                            const ak = lerp(a0, a1, k / Math.max(1, steps));
                            out.gain.linearRampToValueAtTime(ak, tk + 0.25 / s.am);
                            out.gain.linearRampToValueAtTime(ak * 0.12, tk + 0.75 / s.am);
                        }
                        out.gain.linearRampToValueAtTime(a1, t + d);
                    } else {
                        out.gain.linearRampToValueAtTime(a1, t + d);
                    }
                    if (s.vib) {
                        vibGain.gain.setValueAtTime(0, t);
                        vibGain.gain.linearRampToValueAtTime(s.f[0] * pf * 0.06, t + d * 0.4);
                        vibGain.gain.setValueAtTime(s.f[0] * pf * 0.06, t + d);
                    }
                    t += d;
                });
                out.gain.linearRampToValueAtTime(0.0001, t + 0.03);
                vibGain.gain.setValueAtTime(0, t);

                src.start(now); vib.start(now); breath.start(now, Math.random() * 0.5);
                src.stop(t + 0.06); vib.stop(t + 0.06); breath.stop(t + 0.06);

                // Consonant noise bursts ("f", "tch", "k")
                (def.noise || []).forEach(nz => this.playNoiseBurst(nz.d / speed, nz.freq, nz.type, nz.amp * vol, nz.q, (now - this.ctx.currentTime) + nz.t / speed));
                return track;
            }

            playRaspberry(now, pitch, vol, dur) {
                const n = this.noiseSource();
                const lp = this.ctx.createBiquadFilter();
                lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 2.5;
                const buzz = this.ctx.createOscillator();
                buzz.type = 'sawtooth';
                buzz.frequency.setValueAtTime(95 * pitch, now);
                buzz.frequency.linearRampToValueAtTime(70 * pitch, now + dur);
                const buzzF = this.ctx.createBiquadFilter();
                buzzF.type = 'lowpass'; buzzF.frequency.value = 700;
                const flap = this.ctx.createOscillator();
                flap.type = 'square';
                flap.frequency.setValueAtTime(34, now);
                flap.frequency.linearRampToValueAtTime(26, now + dur);
                const flapGain = this.ctx.createGain();
                flapGain.gain.value = 0.5;
                const g = this.ctx.createGain();
                g.gain.setValueAtTime(0.0001, now);
                g.gain.linearRampToValueAtTime(0.5 * vol, now + 0.03);
                g.gain.setValueAtTime(0.5 * vol, now + dur * 0.6);
                g.gain.exponentialRampToValueAtTime(0.0008, now + dur);
                const am = this.ctx.createGain();
                am.gain.value = 0.5;
                flap.connect(flapGain); flapGain.connect(am.gain);
                n.connect(lp); lp.connect(am);
                buzz.connect(buzzF); buzzF.connect(am);
                am.connect(g); g.connect(this.out);
                [n, buzz, flap].forEach(s => { s.start(now); s.stop(now + dur + 0.05); });
            }

            /* ---------------------- PHYSICS IMPACT SOUNDS ---------------------- */
            playImpact(material, speed, x = 0) {
                if (!this.ready()) return;
                const nowT = performance.now();
                // throttle so piles of debris don't become noise
                this.impactBudget = Math.min(6, this.impactBudget + (nowT - this.lastImpact) / 90);
                this.lastImpact = nowT;
                if (this.impactBudget < 1) return;
                this.impactBudget -= 1;
                const vol = clamp((speed - 1.5) / 10, 0.05, 1);
                const now = this.ctx.currentTime;
                const pan = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
                const dest = pan ? pan : this.out;
                if (pan) { pan.pan.value = clamp(x / 10, -0.8, 0.8); pan.connect(this.out); }
                const tone = (type, f0, f1, dur, amp) => {
                    const o = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    o.type = type;
                    o.frequency.setValueAtTime(f0, now);
                    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), now + dur);
                    g.gain.setValueAtTime(amp * vol, now);
                    g.gain.exponentialRampToValueAtTime(0.0005, now + dur);
                    o.connect(g); g.connect(dest);
                    o.start(now); o.stop(now + dur + 0.02);
                };
                const noise = (freq, type, dur, amp, q = 1) => {
                    const n = this.noiseSource();
                    const f = this.ctx.createBiquadFilter();
                    f.type = type; f.frequency.value = freq; f.Q.value = q;
                    const g = this.ctx.createGain();
                    g.gain.setValueAtTime(amp * vol, now);
                    g.gain.exponentialRampToValueAtTime(0.0005, now + dur);
                    n.connect(f); f.connect(g); g.connect(dest);
                    n.start(now, Math.random() * 0.5); n.stop(now + dur + 0.02);
                };
                const r = 0.9 + Math.random() * 0.2;
                switch (material) {
                    case 'flesh':
                        tone('sine', 95 * r, 45, 0.16, 0.5);
                        noise(500, 'lowpass', 0.09, 0.25);
                        break;
                    case 'wood':
                        tone('triangle', 420 * r, 260, 0.09, 0.3);
                        noise(1100 * r, 'bandpass', 0.07, 0.35, 2);
                        break;
                    case 'metal':
                        [1, 2.76, 5.4].forEach((m, i) => tone('sine', 520 * r * m, 500 * r * m, 0.45 - i * 0.1, 0.16 / (i + 1)));
                        noise(4000, 'highpass', 0.03, 0.12);
                        break;
                    case 'ceramic':
                        [1, 1.47, 2.3].forEach((m, i) => tone('sine', 1700 * r * m, 1650 * r * m, 0.18, 0.09));
                        noise(5000, 'highpass', 0.02, 0.2);
                        break;
                    case 'plastic':
                        tone('triangle', 620 * r, 340, 0.08, 0.28);
                        break;
                    case 'food':
                        noise(1300 * r, 'lowpass', 0.14, 0.35);
                        tone('sine', 220 * r, 90, 0.1, 0.2);
                        break;
                    case 'ball':
                        tone('sine', 160 * r, 90, 0.14, 0.45);
                        noise(800, 'lowpass', 0.05, 0.2);
                        break;
                    case 'paper':
                        noise(3000 * r, 'bandpass', 0.08, 0.2, 0.6);
                        break;
                    case 'snow':
                        noise(1800 * r, 'lowpass', 0.12, 0.3);
                        break;
                    default:
                        tone('sine', 200 * r, 90, 0.1, 0.3);
                }
            }
            playSplash(big = false) {
                if (!this.ready()) return;
                this.playNoiseBurst(big ? 0.55 : 0.3, 1400, 'bandpass', big ? 0.55 : 0.3, 0.5);
                const now = this.ctx.currentTime;
                for (let i = 0; i < (big ? 6 : 3); i++) {
                    const t = now + 0.04 + Math.random() * 0.25;
                    const o = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    o.type = 'sine';
                    const f = 500 + Math.random() * 900;
                    o.frequency.setValueAtTime(f, t);
                    o.frequency.exponentialRampToValueAtTime(f * 2.2, t + 0.05);
                    g.gain.setValueAtTime(0.08, t);
                    g.gain.exponentialRampToValueAtTime(0.0005, t + 0.06);
                    o.connect(g); g.connect(this.out);
                    o.start(t); o.stop(t + 0.07);
                }
            }
            playSqueak() {
                if (!this.ready()) return;
                const now = this.ctx.currentTime;
                const o = this.ctx.createOscillator();
                const f = this.ctx.createBiquadFilter();
                const g = this.ctx.createGain();
                o.type = 'square';
                o.frequency.setValueAtTime(1100, now);
                o.frequency.linearRampToValueAtTime(1600, now + 0.08);
                o.frequency.linearRampToValueAtTime(900, now + 0.2);
                f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 3;
                g.gain.setValueAtTime(0.0001, now);
                g.gain.linearRampToValueAtTime(0.25, now + 0.02);
                g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                o.connect(f); f.connect(g); g.connect(this.out);
                o.start(now); o.stop(now + 0.24);
            }
            playPop(pitch = 1) {
                if (!this.ready()) return;
                const now = this.ctx.currentTime;
                const o = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                o.type = 'sine';
                o.frequency.setValueAtTime(700 * pitch, now);
                o.frequency.exponentialRampToValueAtTime(180 * pitch, now + 0.07);
                g.gain.setValueAtTime(0.3, now);
                g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                o.connect(g); g.connect(this.out);
                o.start(now); o.stop(now + 0.1);
            }
            playSnap() {
                this.playNoiseBurst(0.06, 2500, 'highpass', 0.4, 0.7);
            }
        }

        const sound = new SoundEngine();
        /* ============================================================================

        THREE.ShaderChunk.tonemapping_pars_fragment = THREE.ShaderChunk.tonemapping_pars_fragment.replace(

                vec3 c = color * ( lt / max( l, 1e-5 ) );
                float m = max( c.r, max( c.g, c.b ) );
                if ( m > 1.0 ) c = mix( c / m, vec3( 1.0 ), clamp( ( m - 1.0 ) * 0.18, 0.0, 0.45 ) );

        // Gradient sky dome with sun disc, glow and twinkling stars
        const skyUniforms = {

        /* ---------- HAIR STYLES ---------- */
        function buildHair(style, mat) {
            const g = new THREE.Group();
            const parts = [];
            const add = geo => parts.push(geo);
            const cap = (phiLen = 0.52, r = 0.285, y = 0.06) => xf(new THREE.SphereGeometry(r, 28, 16, 0, TAU, 0, Math.PI * phiLen), 0, y, 0, 0, 0, 0, 0.97, 1.16, 1.0);
            switch (style) {
                case 'spiky': {
                    add(cap(0.52, 0.288, 0.06));
                    for (let s = 0; s < 24; s++) {
                        const ang = (s / 24) * TAU + (s % 3) * 0.1;
                        const ring = s % 2 === 0 ? 0.17 : 0.09;
                        const len = 0.18 + ((s * 37) % 7) * 0.012;
                        const sp = new THREE.ConeGeometry(0.06, len, 7);
                        const e = new THREE.Euler(Math.sin(ang) * 0.6, 0, -Math.cos(ang) * 0.6);
                        const m4 = new THREE.Matrix4().makeRotationFromEuler(e);
                        m4.setPosition(Math.cos(ang) * ring, 0.31 + (s % 2) * 0.04, Math.sin(ang) * ring + 0.01);
                        sp.applyMatrix4(m4);
                        add(sp);
                    }
                    [-0.15, -0.05, 0.05, 0.15].forEach(fx => add(xf(new THREE.ConeGeometry(0.055, 0.18, 6), fx, 0.255, 0.215, 2.4, 0, fx * 1.2)));
                    break;
                }
                case 'ponytail': {
                    add(cap(0.55, 0.29, 0.05));
                    add(xf(new THREE.SphereGeometry(0.16, 14, 12), 0, 0.42, -0.04, 0, 0, 0, 1.1, 0.9, 1.1));
                    [-1, 1].forEach(side => {
                        for (let seg = 0; seg < 5; seg++) add(xf(new THREE.SphereGeometry(0.095, 10, 8), side * (0.27 + Math.sin(seg * 1.2) * 0.03), 0.12 - seg * 0.15, 0.04 + Math.cos(seg * 1.1) * 0.03, 0, 0, 0, 0.75, 1.45, 0.75));
                    });
                    break;
                }
                case 'wavy': {
                    add(cap(0.56, 0.295, 0.06));
                    [-1, 1].forEach(side => {
                        for (let seg = 0; seg < 4; seg++) add(xf(new THREE.SphereGeometry(0.095, 10, 8), side * (0.265 + Math.sin(seg * 1.4) * 0.025), 0.1 - seg * 0.13, 0.0, 0, 0, 0, 0.8, 1.35, 0.85));
                    });
                    for (let seg = 0; seg < 5; seg++) add(xf(new THREE.SphereGeometry(0.11, 10, 8), (seg - 2) * 0.1, -0.02 - Math.abs(seg - 2) * 0.03, -0.2, 0, 0, 0, 0.9, 1.4, 0.8));
                    break;
                }
                case 'buzz': add(cap(0.5, 0.292, 0.04)); break;
                case 'afro': {
                    for (let k = 0; k < 46; k++) {
                        const u = (k * 0.618) % 1, v = k / 46;
                        const th = u * TAU, ph = Math.acos(1 - v * 1.25);
                        const r = 0.37;
                        add(xf(new THREE.SphereGeometry(0.11, 8, 6), Math.sin(ph) * Math.cos(th) * r, 0.14 + Math.cos(ph) * r * 0.95, Math.sin(ph) * Math.sin(th) * r - 0.04));
                    }
                    break;
                }
                case 'mohawk': {
                    add(cap(0.45, 0.288, 0.03));
                    for (let k = 0; k < 9; k++) {
                        const a = -0.9 + k * 0.24;
                        add(xf(new THREE.ConeGeometry(0.05, 0.26, 4), 0, 0.3 * Math.cos(a) + 0.06, 0.3 * Math.sin(a), a, 0, 0, 1, 1, 0.35));
                    }
                    break;
                }
                case 'sidepart': {
                    add(cap(0.53, 0.292, 0.06));
                    add(xf(new THREE.SphereGeometry(0.16, 14, 10), 0.08, 0.27, 0.15, 0.3, 0, -0.5, 1.4, 0.5, 0.9));
                    add(xf(new THREE.SphereGeometry(0.14, 14, 10), -0.1, 0.3, 0.1, 0.2, 0, 0.3, 1.2, 0.5, 1.0));
                    break;
                }
                case 'curly': {
                    add(cap(0.5, 0.282, 0.05));
                    for (let k = 0; k < 38; k++) {
                        const th = k * 2.4, ph = 0.25 + (k / 38) * 1.1;
                        add(xf(new THREE.SphereGeometry(0.06, 7, 6), Math.sin(ph) * Math.cos(th) * 0.29, 0.06 + Math.cos(ph) * 0.34, Math.sin(ph) * Math.sin(th) * 0.29));
                    }
                    break;
                }
                case 'mullet': {
                    add(cap(0.53, 0.29, 0.05));
                    for (let k = 0; k < 5; k++) add(xf(new THREE.SphereGeometry(0.1, 10, 8), (k - 2) * 0.09, -0.06 - Math.abs(k - 2) * 0.02, -0.22, 0.3, 0, 0, 0.8, 1.9, 0.7));

                case 'slick': {
                    add(cap(0.52, 0.292, 0.05));

            if (parts.length) {

        }
        function buildFacialHair(type, mat) {
            const parts = [];

        /* ---------- clothing / prop textures ---------- */
        // Procedural textures are cached by key (pattern + colours). Every level load bumps a
        // stamp; textures no level has asked for in a while are freed, so endless play stays light.
        const texCache = new Map();
        let texStamp = 0;
        function cachedTex(key, fn) {
            let e = texCache.get(key);
            if (!e) { e = { tex: markShared(fn()), stamp: texStamp }; texCache.set(key, e); }

                e.tex.dispose();
                texCache.delete(key);

        }
        function stripeTexture(c1, c2, n = 6, vertical = false) {

                ctx.fillStyle = cssHex(c1); ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = cssHex(c2);

        // Fabric patterns for clothes (all procedural, all colourful)
        function fabricTexture(pattern, c1, c2 = 0xffffff, c3 = 0xfacc15) {
            return cachedTex(`fab_${pattern}_${c1}_${c2}_${c3}`, () => canvasTex(256, 256, (ctx, w, h) => {
                ctx.fillStyle = cssHex(c1); ctx.fillRect(0, 0, w, h);
                const col2 = cssHex(c2), col3 = cssHex(c3);
                if (pattern === 'stripes') { ctx.fillStyle = col2; for (let i = 0; i < 8; i++) ctx.fillRect(0, i * 32, w, 13); }
                else if (pattern === 'vstripes') { ctx.fillStyle = col2; for (let i = 0; i < 8; i++) ctx.fillRect(i * 32, 0, 12, h); }
                else if (pattern === 'dots') { ctx.fillStyle = col2; for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) { ctx.beginPath(); ctx.arc(i * 43 + (j % 2) * 21 + 10, j * 43 + 10, 8, 0, TAU); ctx.fill(); } }

                    [[44, 48], [136, 44], [212, 56], [82, 118], [176, 115], [32, 138], [52, 204], [142, 198], [216, 196]].forEach(([x, y]) => {
                        ctx.fillStyle = '#facc15';

                        ctx.beginPath(); ctx.arc(x - 7, y - 5, 8.5, 0, TAU); ctx.fill();
                        ctx.fillStyle = '#f97316'; ctx.beginPath(); ctx.ellipse(x - 16, y - 4, 4.5, 2.5, 0, 0, TAU); ctx.fill();
                        ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(x - 9, y - 7, 1.6, 0, TAU); ctx.fill();
                    });
                } else if (pattern === 'smileyflowers') {
                    [[45, 50], [125, 40], [205, 55], [30, 125], [95, 115], [170, 125], [230, 130], [55, 200], [135, 195], [205, 205]].forEach(([cx, cy]) => {
                        ctx.fillStyle = '#fbbf24';
                        for (let p = 0; p < 7; p++) { const a = (p / 7) * TAU; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * 14, cy + Math.sin(a) * 14, 9, 0, TAU); ctx.fill(); }
                        ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(cx, cy, 11, 0, TAU); ctx.fill();

                        ctx.fillStyle = '#ffffff';
                        for (let p = 0; p < 8; p++) { const a = (p / 8) * TAU; ctx.beginPath(); ctx.ellipse(cx + Math.cos(a) * 11, cy + Math.sin(a) * 11, 7, 4.2, a, 0, TAU); ctx.fill(); }
                        ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(cx, cy, 6.5, 0, TAU); ctx.fill();
                    });

                        ctx.beginPath();
                        for (let p = 0; p < 10; p++) { const a = -Math.PI / 2 + (p / 10) * TAU, r = p % 2 ? 6 : 14; ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }

                } else if (pattern === 'checker') {
                    ctx.fillStyle = col2;
                    for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) if ((i + j) % 2) ctx.fillRect(i * 32, j * 32, 32, 32);

                    ctx.fillStyle = '#e5e7eb';
                    ctx.fillRect(0, 150, w, 22); ctx.fillRect(0, 200, w, 22);

        // Front print textures (jersey numbers / logos) mapped once around the torso (u=0.25 is the front center)
        function printTexture(kind, c1, c2, text = '7') {
            return cachedTex(`print_${kind}_${c1}_${c2}_${text}`, () => canvasTex(512, 256, (ctx, w, h) => {
                ctx.fillStyle = cssHex(c1); ctx.fillRect(0, 0, w, h);

        /* ---------- HANDS (realistic palm + jointed fingers, merged per pose) ---------- */
        const HAND_POSES = {
            relaxed: { f: [[0.25, 0.4, 0.25], [0.3, 0.45, 0.3], [0.35, 0.5, 0.3], [0.42, 0.55, 0.35]], spread: 0.04, thumb: [0.35, 0.25, 0.2] },

            rock: { f: [[0.0, 0.05, 0.03], [1.55, 1.7, 1.1], [1.55, 1.7, 1.1], [0.0, 0.05, 0.03]], spread: 0.2, thumb: [0.9, 0.7, 0.5] }

        function handGeometry(pose, side) {
            return getShared(`hand_${pose}_${side}`, () => {
                const P = HAND_POSES[pose] || HAND_POSES.relaxed;
                const parts = [];
                // palm (rounded, slightly wider at knuckles)
                const palm = roundedBoxGeo(0.042, 0.115, 0.094, 0.018, 3);
                const pp = palm.attributes.position;
                for (let i = 0; i < pp.count; i++) {
                    const y = pp.getY(i);

                const frad = [0.0118, 0.0122, 0.0115, 0.0102];
                for (let f = 0; f < 4; f++) {

                    m.multiply(new THREE.Matrix4().makeRotationX((f - 1.5) * P.spread * 0.6));

                        const r0 = frad[f] * (1 - s * 0.08), r1 = frad[f] * (1 - (s + 1) * 0.08);

                        parts.push(seg);
                        m.multiply(new THREE.Matrix4().makeTranslation(0, -segL[s], 0));
                    }
                }
                // thumb from the front-inner side of the palm
                const tm = new THREE.Matrix4().makeTranslation(-0.006, -0.03, 0.04);
                tm.multiply(new THREE.Matrix4().makeRotationX(P.thumbUp ? -1.5 : -0.75));
                tm.multiply(new THREE.Matrix4().makeRotationY(0.5));

                    seg.applyMatrix4(tm);
                    parts.push(seg);
                    tm.multiply(new THREE.Matrix4().makeTranslation(0, -tl[s], 0));

                parts.push(xf(new THREE.SphereGeometry(0.045, 14, 10), 0.0, -0.005, 0, 0, 0, 0, 0.75, 0.6, 1.0));
                let g = mergeStd(parts);

                if (side < 0) {
                    g.scale(-1, 1, 1);
                    const idx = g.index.array;
                    for (let i = 0; i < idx.length; i += 3) { const t = idx[i + 1]; idx[i + 1] = idx[i + 2]; idx[i + 2] = t; }
                    g.computeVertexNormals();
                }
                return g;
            });
        }

        /* ---------- FEET & FOOTWEAR (foot bone at the ankle; sole at y = -0.09) ---------- */
        function bareFootGeometry(side) {

                    const swoosh = mesh(xf(new THREE.TorusGeometry(0.06, 0.008, 6, 16, Math.PI * 0.8), side * 0.068, -0.045, 0.09, 0, Math.PI / 2, 0.3), stdMat(c2, 0.5));

            // Character-space point -> world
            toWorld(x, y, z, out = new THREE.Vector3()) {

            }
            // Two-bone analytic IK. target/pole are world-space; pole is a direction hint for the middle joint.
            ik(limb, target, pole, opts = {}) {
                const T = IKT;
                const isArm = limb === 'armL' || limb === 'armR';
                const s = limb.endsWith('L') ? 'L' : 'R';
                const U = this.bone[(isArm ? 'upperArm' : 'thigh') + s];
                const M = this.bone[(isArm ? 'forearm' : 'shin') + s];
                const E = this.bone[(isArm ? 'hand' : 'foot') + s];
                T.tgtIn.copy(target);
                T.poleIn.copy(pole);
                U.parent.updateWorldMatrix(true, false);
                U.updateWorldMatrix(false, false);
                const A = U.getWorldPosition(T.A);
                const sc = this.root.scale.x;
                const l1 = M.position.length() * sc, l2 = E.position.length() * sc;
                const d = T.d.subVectors(T.tgtIn, A);
                let dist = d.length();
                const maxD = (l1 + l2) * 0.9995, minD = Math.abs(l1 - l2) + 0.02;
                if (dist < 1e-5) { d.set(0, -1, 0); dist = minD; }
                const dir = d.normalize();
                dist = clamp(dist, minD, maxD);
                const pp = T.pp.copy(T.poleIn).addScaledVector(dir, -T.poleIn.dot(dir));
                if (pp.lengthSq() < 1e-8) { pp.set(0, 0, 1).addScaledVector(dir, -dir.z); if (pp.lengthSq() < 1e-8) pp.set(1, 0, 0); }

                const sinA = Math.sqrt(1 - cosA * cosA);

                const elbow = T.el.copy(A).addScaledVector(u, l1);

                const hingeSign = isArm ? -1 : 1;

            /* ---------------- face ---------------- */
            initFace() {

            expression(name, k = 1) {
                const t = this.fs.target;
                Object.assign(t, { lid: 0, open: 0, round: 0, wide: 0, cheek: 0, brow: 0, browAng: 0, pupil: 1 });
                this.fs.chew = 0;
                switch (name) {
                    case 'happy': t.lid = 0.25 * k; t.wide = 0.6 * k; t.brow = 0.4 * k; break;
                    case 'strain': t.lid = 0.55 * k; t.cheek = 1.0 * k; t.brow = -0.6 * k; t.browAng = 0.5 * k; t.round = 0.3 * k; break;
                    case 'shock': t.lid = 0; t.open = 0.8 * k; t.round = 0.6 * k; t.brow = 1 * k; t.pupil = 0.65; break;
                    case 'sleep': t.lid = 0.98; t.open = 0.15; t.brow = -0.2; break;
                    case 'sleepy': t.lid = 0.6; t.brow = -0.1; break;
                    case 'sing': t.open = 0.6; t.lid = 0.3; t.brow = 0.6; break;
                    case 'kiss': t.round = 1.0; t.lid = 0.35; t.brow = 0.3; break;
                    case 'focus': t.lid = 0.3; t.brow = -0.4; t.browAng = 0.4; t.wide = 0.3; break;
                    case 'angry': t.lid = 0.35; t.brow = -0.7; t.browAng = 0.9; t.wide = 0.5; break;
                    case 'chew': this.fs.chew = 1; t.cheek = 0.45; t.lid = 0.15; break;
                    case 'excited': t.open = 0.55; t.wide = 0.5; t.brow = 0.9; t.pupil = 1.15; break;

            updateFace(dt) {

                if (fs.blink > 0) fs.blink -= dt;

            }

            /* ---------------- per frame ---------------- */

        const RD_RADIUS = { pelvis: 0.17, hipL: 0.15, hipR: 0.15, belly: 0.19, chest: 0.21, shL: 0.12, shR: 0.12, neck: 0.09, head: 0.26, uaL: 0.09, elL: 0.08, haL: 0.075, uaR: 0.09, elR: 0.08, haR: 0.075, thL: 0.12, knL: 0.1, ftL: 0.085, thR: 0.12, knR: 0.1, ftR: 0.085 };

        /* ============================================================================
         * ACTIVITIES FRAMEWORK: each level = one (or two) funny activities in a world.
         * Activities place realistic props, spawn guys with behaviours (poses + IK)
         * and decide how their props react physically when things get hit.
         * ============================================================================ */
        const ACTIVITIES = {};
        function defActivity(id, def) { def.id = id; ACTIVITIES[id] = def; return def; }

        const _aq = new THREE.Quaternion();

        class ActivityContext {
            constructor(def, plan, W, rng) {
                this.def = def; this.plan = plan; this.world = W; this.rng = rng;
                this.level = plan.level;
                this.count = plan.count;
                this.speed = plan.speed;
                this.palette = rng.pick(PALETTES);
                this.chars = [];
                this.updaters = [];
                this.disposers = [];
                this.camera = def.camera ? JSON.parse(JSON.stringify(def.camera)) : null;
                this.aim = def.aim ? Object.assign({}, def.aim) : null;
                this.t = 0;
            }
            look(theme) { return makeLook(theme || this.plan.theme || this.def.theme || (this.world.def && this.world.def.theme) || 'casual', this.rng, this.palette); }
            addChar(opts) {
                const c = new Character(Object.assign({ activity: this, phase: this.rng.float(0, 20) }, opts));
                this.chars.push(c);
                return c;
            }
            add(obj) { levelGroup.add(obj); return obj; }
            collider(c) { return physics.addCollider(c); }
            onUpdate(fn) { this.updaters.push(fn); }
            onDispose(fn) { this.disposers.push(fn); }
            breakable(spec) { spec.intact = spec.intact ?? true; levelBreakables.push(spec); return spec; }
            update(dt, t) { this.t += dt; for (let i = 0; i < this.updaters.length; i++) this.updaters[i](dt, this.t); }
            dispose() { this.disposers.forEach(f => { try { f(); } catch (e) { console.warn(e); } }); }
            // evenly spaced x positions centred on 0
            spread(n, gap) { const out = []; for (let i = 0; i < n; i++) out.push((i - (n - 1) / 2) * gap); return out; }
            // physics props that rest until something knocks them
            restingProp(obj, hx, hy, hz, opts = {}) {
                obj.userData.levelObject = true;
                return makeRigidBox(obj, hx, hy, hz, Object.assign({ sleep: true, material: obj.userData.material || 'plastic', invMass: obj.userData.invMass ?? 1.5 }, opts));
            }
            restingBall(obj, r, opts = {}) {
                obj.userData.levelObject = true;
                return makeBall(obj, r, Object.assign({ sleep: true, material: obj.userData.material || 'ball' }, opts));
            }
        }
        function buildActivity(plan, W, rng) {
            const def = ACTIVITIES[plan.activity] || ACTIVITIES.jog;
            const A = new ActivityContext(def, plan, W, rng);
            def.build(A);
            if (plan.extra && ACTIVITIES[plan.extra]) {
                // combo levels: a second, smaller activity on the side
                const def2 = ACTIVITIES[plan.extra];
                const sub = new ActivityContext(def2, Object.assign({}, plan, { count: Math.max(1, Math.floor(plan.count / 2)) }), W, new RNG(plan.seed ^ 0x9e37));
                sub.sideOffset = plan.extraSide || 1;
                sub.isSide = true;
                def2.build(sub);
                A.updaters.push((dt, t) => sub.update(dt, t));

        /* ---------------- shared pose helpers ---------------- */
        function dirWorld(c, x, y, z, out = new THREE.Vector3()) {

        // Natural walk / jog / run gait (FK) — phase advances with distance travelled
        function gait(c, phase, o = {}) {
            const amp = o.amp ?? 1, run = o.run ?? 0;
            const s = Math.sin(phase), cs = Math.cos(phase);
            const stride = (0.42 + run * 0.28) * amp;
            const kneeK = (0.55 + run * 0.75) * amp;
            c.leg(1, { flex: s * stride + run * 0.1, knee: Math.max(0, cs) * kneeK + 0.08 + run * 0.15, ankle: -s * 0.18 * amp, twist: 0.05 });
            c.leg(-1, { flex: -s * stride + run * 0.1, knee: Math.max(0, -cs) * kneeK + 0.08 + run * 0.15, ankle: s * 0.18 * amp, twist: 0.05 });
            c.hips(-0.02 - Math.abs(s) * (0.02 + run * 0.04) * amp - run * 0.05, 0, s * 0.07 * amp, 0);
            if (!o.noArms) {
                c.arm(1, { flex: -s * (0.38 + run * 0.55) * amp, abd: 0.16, elbow: 0.3 + run * 1.0, hand: run > 0.3 ? 'fist' : 'relaxed' });
                c.arm(-1, { flex: s * (0.38 + run * 0.55) * amp, abd: 0.16, elbow: 0.3 + run * 1.0, hand: run > 0.3 ? 'fist' : 'relaxed' });

        function activityPool() { return Object.keys(ACTIVITIES); }
        function curatedList() { return CURATED_LEVELS.filter(e => ACTIVITIES[e[0]] && WORLDS[e[1]]); }

        function baseActivityFor(n) {
            const cur = curatedList();
            if (n <= cur.length) return cur[n - 1][0];
            const pool = activityPool().sort();
            const k = n - cur.length - 1;
            const cycle = Math.floor(k / pool.length);
            const order = new RNG(hashSeed('cycle', cycle)).shuffle(pool);
            let a = order[k % pool.length];
            if (k % pool.length === 0 && cycle > 0) {
                const prevOrder = new RNG(hashSeed('cycle', cycle - 1)).shuffle(pool);
                if (prevOrder[pool.length - 1] === a) a = order[1 % pool.length];

                const prevOrder = new RNG(hashSeed('cycle', cycle - 1)).shuffle(pool);
                if (prevOrder[pool.length - 1] === order[0]) a = order[0];

            return a;

            const def = ACTIVITIES[activity];
            const pref = (def.worlds || WORLD_IDS).filter(w => WORLDS[w] && !(def.noWorlds || []).includes(w));
            let world = (rng.chance(0.22) && !def.worldsOnly) ? rng.pick(WORLD_IDS.filter(w => !(def.noWorlds || []).includes(w) && !WORLDS[w].special && !WORLDS[w].waterOnly)) : rng.pick(pref);
            if (WORLDS[world].waterOnly && !(def.worlds || []).includes(world)) world = rng.pick(pref);

        function finalWorldFor(n) {
            if (_worldMemo.has(n)) return _worldMemo.get(n);
            const activity = baseActivityFor(n);
            const def = ACTIVITIES[activity];
            let { world, variant } = baseWorldFor(n, activity);
            if (n > curatedList().length && n > 1) {
                let k = n - 1;
                while (k > 1 && !_worldMemo.has(k)) k--;      // fill the memo iteratively (no deep recursion)
                for (; k < n - 1; k++) finalWorldFor(k);
                const prev = finalWorldFor(n - 1);
                if (prev.world === world && !(def.worldsOnly && (def.worlds || []).length < 2)) {
                    const rng = new RNG(hashSeed('world2', n));
                    const pref = (def.worlds || WORLD_IDS).filter(w => WORLDS[w] && w !== world);
                    world = pref.length ? rng.pick(pref) : rng.pick(WORLD_IDS.filter(w => w !== world && !WORLDS[w].special && !WORLDS[w].waterOnly));
                    variant = rng.pick(WORLDS[world].variants);
                }
            }
            const res = { world, variant };
            _worldMemo.set(n, res);
            return res;
        }

            n = Math.max(1, Math.floor(n));

            const cur = curatedList();
            const rng = new RNG(hashSeed('plan', n));

            const count = clamp(cMin + Math.floor(tier / 2) + (rng.chance(0.35) ? 1 : 0), cMin, cMax);

            }
            const worldTheme = WORLDS[world].theme;
            const theme = def.fixedTheme ? def.theme : (rng.chance(0.3) ? worldTheme : def.theme);

        /* ============================================================================

        const HIT_LABELS = {

        /* ============================================================================
         * THROWN DISC & GUN BULLET PROJECTILE CLASS
         * ============================================================================ */
        const discTrailGeo = markShared(new THREE.RingGeometry(0.95 * 0.5, 0.95 * 0.92, 16));
        const bulletTrailGeo = markShared(new THREE.SphereGeometry(0.12, 8, 8));
        const _hitTmp = { nx: 0, ny: 0, nz: 0, depth: 0 };
        class ThrownDisc {
            constructor(startPos, velocity, curveAccelX, mode, isBullet = false) {
                this.mode = mode;
                this.isBullet = isBullet;
                this.group = new THREE.Group();
                this.group.position.copy(startPos);
                this.vel = velocity.clone();
                this.curveAccelX = isBullet ? 0 : curveAccelX;
                this.radius = isBullet ? 0.42 : mode.radius;
                this.hitRadius = isBullet ? 0.34 : 0.62;  // generous = soft to play
                this.age = 0;

                this.hits = 0;
                this.bounces = 0;
                this.hitChars = new Set();

                if (isBullet) {
                    // Sleek high-caliber golden tracer bullet
                    const brassMat = new THREE.MeshStandardMaterial({ color: C(0xfacc15), emissive: C(0xf59e0b), emissiveIntensity: 0.65, metalness: 0.8, roughness: 0.15 });
                    const slug = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.14, 0.65, 12), brassMat);
                    slug.rotation.x = Math.PI / 2;
                    this.group.add(slug);
                    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.3, 12), brassMat);
                    tip.rotation.x = -Math.PI / 2;
                    tip.position.z = -0.45;
                    this.group.add(tip);
                    this.group.lookAt(startPos.clone().add(velocity));
                } else {
                    // Outer glowing rim
                    const outerMat = new THREE.MeshStandardMaterial({ color: C(mode.color), emissive: C(mode.color), emissiveIntensity: 0.35, metalness: 0.6, roughness: 0.2 });
                    const discBody = new THREE.Mesh(new THREE.CylinderGeometry(mode.radius, mode.radius, 0.09, 28), outerMat);
                    discBody.castShadow = true;
                    this.group.add(discBody);
                    // Inner metallic core ring
                    const coreMat = new THREE.MeshStandardMaterial({ color: C(mode.rimColor), roughness: 0.3, metalness: 0.4 });
                    this.group.add(new THREE.Mesh(new THREE.CylinderGeometry(mode.radius * 0.55, mode.radius * 0.55, 0.13, 24), coreMat));
                    // Saw teeth / ninja blades around edge
                    const bladeCount = 8;
                    for (let i = 0; i < bladeCount; i++) {
                        const ang = (i / bladeCount) * Math.PI * 2;
                        const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.35, 4), coreMat);
                        tooth.rotation.z = -Math.PI / 2;
                        tooth.rotation.y = ang;
                        tooth.position.set(Math.cos(ang) * mode.radius, 0, Math.sin(ang) * mode.radius);
                        this.group.add(tooth);
                    }
                    // Slight bank tilt based on curve
                    this.group.rotation.z = THREE.MathUtils.clamp(-curveAccelX * 0.025, -0.45, 0.45);
                }
                scene.add(this.group);
                this.trailMeshes = [];
            }

            update(dt) {
                if (!this.active) return;
                this.age += dt;
                // Apply horizontal spin curve & subtle gravity drop (moon = floatier)
                const gk = physics.gravity / -22;
                this.vel.x += this.curveAccelX * dt;
                this.vel.y -= (this.isBullet ? 0.25 : 1.8) * gk * dt;
                // Sub-step movement for accurate collision detection
                const steps = this.isBullet ? 6 : 4;
                const stepDt = dt / steps;
                for (let s = 0; s < steps; s++) {
                    this.group.position.addScaledVector(this.vel, stepDt);
                    this.checkCollisions(stepDt);

                }
                if (!this.isBullet) this.group.rotation.y += 32 * dt;
                // Spawn subtle ribbon trail ghost
                if (Math.random() < 0.75) {
                    const ghost = new THREE.Mesh(this.isBullet ? bulletTrailGeo : discTrailGeo, new THREE.MeshBasicMaterial({ color: C(this.isBullet ? 0xfef08a : this.mode.color), transparent: true, opacity: 0.5, side: THREE.DoubleSide, depthWrite: false }));
                    if (!this.isBullet) ghost.rotation.x = Math.PI / 2;
                    ghost.position.copy(this.group.position);
                    scene.add(ghost);

                }
                // Out of bounds cleanup
                const p = this.group.position;
                if (this.age > 3.2 || p.z < -30 || p.y < physics.groundY + 0.08 || p.y > 40 || Math.abs(p.x) > 24) this.deactivate();
            }

            checkCollisions(stepDt) {
                const pos = this.group.position;
                // 1. breakable activity props (barrels, crates, wells, disco ball...)
                for (let i = 0; i < levelBreakables.length; i++) {
                    const b = levelBreakables[i];
                    if (!b.intact) continue;
                    if (b.test(pos.x, pos.y, pos.z, this.hitRadius)) {
                        b.hit(pos.clone(), this.vel.clone(), this.isBullet ? 'bullet' : 'disc');
                        if (b.slow) this.vel.multiplyScalar(b.slow);
                    }
                }
                // 2. characters (real body-part capsules)
                for (let i = 0; i < allCharacters.length; i++) {

                    if (!e.alive || this.hitChars.has(e)) continue;
                    const bs = e.boundSphere;
                    const dx = pos.x - bs.x, dy = pos.y - bs.y, dz = pos.z - bs.z;
                    const rr = bs.r + this.hitRadius;
                    if (dx * dx + dy * dy + dz * dz > rr * rr) continue;
                    let best = null, bestD = Infinity;
                    for (let k = 0; k < e.capsules.length; k++) {
                        const cap = e.capsules[k];
                        const d = capsuleDistance(cap, pos.x, pos.y, pos.z);
                        if (d < bestD) { bestD = d; best = cap; }
                    }
                    if (!best || bestD > this.hitRadius) continue;
                    // Shield guard blocks frontal disc hits (curve around it or use the gun!)
                    if (e.hasShield && !this.isBullet && (best.part === 'torso' || best.part === 'armR') && this.vel.z < 0 && Math.abs(this.vel.x) < 11 && e.shieldMesh && e.shieldMesh.parent) {
                        e.hasShield = false;
                        const sm = e.shieldMesh;
                        makeRigidPoints(sm, boxPoints(0.55, 0.55, 0.08, 0.04), 0.1, { vel: new THREE.Vector3(this.vel.x * 0.25 - 4, 5.5, 4), spin: new THREE.Vector3(8, 12, -9), material: 'metal', invMass: 1.2 });
                        sound.playRicochet();
                        spawnFloatingText(pos.clone(), 'SHIELD BROKEN!');
                        e.say('hmph', 0.8);
                        this.vel.z = Math.abs(this.vel.z) * 0.65;
                        this.vel.x += (Math.random() - 0.5) * 14;
                        this.hitChars.add(e);
                        return;
                    }
                    const part = best.part;
                    this.hitChars.add(e);
                    const sever = part === 'torso' ? (pos.y - e.root.position.y) < 1.95 * e.scale : true;
                    registerKill(e, { pos: pos.clone(), vel: this.vel.clone(), part, sever, kind: this.isBullet ? 'bullet' : 'disc' });
                    this.hits++;

                }
                // 3. push physics objects (ragdolls, props, food...) the disc flies through
                if (physics.bodies.length) physics.pushNear(pos.x, pos.y, pos.z, this.hitRadius, this.vel.x, this.vel.y, this.vel.z, this.isBullet ? 0.08 : 0.16);
                // 4. ricochet off solid static colliders (walls, pillars, stages)
                for (let i = 0; i < physics.colliders.length; i++) {

                    if (c.collide(pos.x, pos.y, pos.z, 0.25, _hitTmp)) {
                        if (this.isBullet) { sound.playRicochet(); this.deactivate(); return; }
                        pos.x += _hitTmp.nx * _hitTmp.depth; pos.y += _hitTmp.ny * _hitTmp.depth; pos.z += _hitTmp.nz * _hitTmp.depth;
                        const vn = this.vel.x * _hitTmp.nx + this.vel.y * _hitTmp.ny + this.vel.z * _hitTmp.nz;
                        if (vn < 0) {
                            this.vel.x -= 1.7 * vn * _hitTmp.nx; this.vel.y -= 1.7 * vn * _hitTmp.ny; this.vel.z -= 1.7 * vn * _hitTmp.nz;
                            this.vel.multiplyScalar(0.8);
                            this.curveAccelX *= -0.5;
                            this.bounces++;
                            sound.playRicochet();
                            if (this.bounces > 3) this.deactivate();
                        }
                    }
                }
            }

            deactivate() {
                this.active = false;
                scene.remove(this.group);
                disposeTree(this.group);
            }

            updateTrail(dt) {
                for (let i = this.trailMeshes.length - 1; i >= 0; i--) {
                    const t = this.trailMeshes[i];
                    t.alpha -= dt * 2.4;
                    if (t.alpha <= 0) {
                        scene.remove(t.mesh);
                        t.mesh.material.dispose();
                        this.trailMeshes.splice(i, 1);
                    } else {
                        t.mesh.material.opacity = t.alpha;
                        t.mesh.scale.multiplyScalar(0.96);
                    }
                }
            }

            destroyClean() {
                scene.remove(this.group);
                this.trailMeshes.forEach(t => { scene.remove(t.mesh); t.mesh.material.dispose(); });
                this.trailMeshes = [];
            }
        }

        /* ============================================================================
