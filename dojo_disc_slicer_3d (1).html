<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dojo Disc Slicer 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #68e1fd;
            font-family: 'Fredoka', sans-serif;
            touch-action: none;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        /* Stroke text matching the video HUD */
        .hud-level-text {
            font-family: 'Fredoka', sans-serif;
            font-weight: 800;
            color: #ffffff;
            text-shadow:
                -2px -2px 0 #1f2937,
                 2px -2px 0 #1f2937,
                -2px  2px 0 #1f2937,
                 2px  2px 0 #1f2937,
                 0px  3px 0 #111827;
            letter-spacing: 0.5px;
        }
        /* Comic 3D Level Complete Title */
        .level-complete-title {
            font-family: 'Luckiest Guy', cursive;
            color: #ffdd00;
            letter-spacing: 2px;
            line-height: 0.95;
            text-align: center;
            text-shadow:
                -3px -3px 0 #1e1b4b,
                 3px -3px 0 #1e1b4b,
                -3px  3px 0 #1e1b4b,
                 3px  3px 0 #1e1b4b,
                 0px  4px 0 #312e81,
                 0px  7px 0 #3730a3,
                 0px 10px 0 #1e1b4b,
                 0px 14px 20px rgba(0,0,0,0.45);
            transform: rotate(-3deg);
            animation: popBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes popBounce {
            0% { transform: scale(0.2) rotate(-10deg); opacity: 0; }
            70% { transform: scale(1.08) rotate(-2deg); opacity: 1; }
            100% { transform: scale(1) rotate(-3deg); opacity: 1; }
        }
        /* Glossy Action Buttons ("Again" & "Continue") */
        .btn-game-orange {
            background: linear-gradient(180deg, #ffbe3b 0%, #f59e0b 100%);
            border: 3px solid #ffffff;
            box-shadow: 0 5px 0 #b45309, 0 8px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-game-orange:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b45309, 0 3px 6px rgba(0,0,0,0.25);
        }
        .btn-game-green {
            background: linear-gradient(180deg, #34d399 0%, #10b981 55%, #059669 100%);
            border: 3px solid #ffffff;
            box-shadow: 0 5px 0 #065f46, 0 8px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-game-green:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #065f46, 0 3px 6px rgba(0,0,0,0.25);
        }
        /* Left-side Blue Power Button */
        .btn-blue-power {
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            border: 3px solid #7dd3fc;
            box-shadow: 0 5px 0 #0369a1, 0 8px 15px rgba(0,0,0,0.25);
            transition: all 0.15s ease;
        }
        .btn-blue-power:hover {
            transform: translateY(-2px) scale(1.04);
        }
        .btn-blue-power:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #0369a1;
        }
        /* Floating Hit Feedback */
        .hit-popup {
            position: absolute;
            pointer-events: none;
            font-family: 'Luckiest Guy', cursive;
            font-size: 1.7rem;
            color: #4ade80;
            text-shadow: -2px -2px 0 #064e3b, 2px -2px 0 #064e3b, -2px 2px 0 #064e3b, 2px 2px 0 #064e3b, 0 4px 8px rgba(0,0,0,0.3);
            animation: floatUpFade 0.85s ease-out forwards;
            z-index: 30;
        }
        @keyframes floatUpFade {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            35% { transform: translate(-50%, -90%) scale(1.15); opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(0.9); opacity: 0; }
        }
    </style>
</head>
<body class="relative select-none overflow-hidden">

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="w-full h-full relative">
        <canvas id="game-canvas"></canvas>
    </div>

    <!-- Top HUD Bar -->
    <div class="fixed top-0 left-0 right-0 p-4 sm:p-5 flex justify-between items-start pointer-events-none z-20">
        <!-- Top-Left: Level Indicator + Hint -->
        <div class="flex flex-col gap-1.5">
            <div class="flex flex-wrap items-center gap-1.5 pointer-events-auto max-w-[72vw]">
                <button id="btn-prev-level" title="Previous Level" class="w-7 h-7 rounded-full bg-slate-900/80 text-white font-extrabold text-sm flex items-center justify-center border border-white/30 hover:bg-slate-800 active:scale-90 transition">
                    &lt;
                </button>
                <div id="level-display" class="hud-level-text text-2xl sm:text-3xl mr-1">Level 1</div>
                <button id="btn-next-level" title="Next Level" class="w-7 h-7 rounded-full bg-slate-900/80 text-white font-extrabold text-sm flex items-center justify-center border border-white/30 hover:bg-slate-800 active:scale-90 transition">
                    &gt;
                </button>
                <button data-jump-level="2" class="btn-level-jump bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-[11px] font-extrabold px-2 py-0.5 rounded-full border-2 border-slate-900 shadow active:scale-95 transition">
                    Lv 2 Well
                </button>
                <button data-jump-level="3" class="btn-level-jump bg-yellow-400 hover:bg-yellow-300 text-slate-950 text-[11px] font-extrabold px-2 py-0.5 rounded-full border-2 border-slate-900 shadow active:scale-95 transition">
                    Lv 3 Gold Pot
                </button>
                <button data-jump-level="4" class="btn-level-jump bg-pink-400 hover:bg-pink-300 text-slate-950 text-[11px] font-extrabold px-2 py-0.5 rounded-full border-2 border-slate-900 shadow active:scale-95 transition">
                    Lv 4 Dress
                </button>
                <button data-jump-level="5" class="btn-level-jump bg-orange-400 hover:bg-orange-300 text-slate-950 text-[11px] font-extrabold px-2 py-0.5 rounded-full border-2 border-slate-900 shadow active:scale-95 transition">
                    Lv 5 Duo
                </button>
                <button data-jump-level="6" class="btn-level-jump bg-amber-300 hover:bg-amber-200 text-slate-950 text-[11px] font-extrabold px-2 py-0.5 rounded-full border-2 border-slate-900 shadow active:scale-95 transition">
                    Lv 6 Helmet
                </button>
                <button id="btn-jump-11" title="Jump to Level 11 (Bicycle Duo)" class="bg-sky-400 hover:bg-sky-300 text-slate-900 text-[11px] font-extrabold px-2 py-0.5 rounded-full border-2 border-slate-900 shadow active:scale-95 transition">
                    Lv 11 Bike
                </button>
                <button id="btn-jump-12" title="Jump to Level 12 (Windmill)" class="bg-purple-400 hover:bg-purple-300 text-slate-900 text-[11px] font-extrabold px-2 py-0.5 rounded-full border-2 border-slate-900 shadow active:scale-95 transition">
                    Lv 12 Wheel
                </button>
                <span id="theme-badge" class="bg-slate-900/75 text-amber-300 text-xs font-extrabold px-2.5 py-0.5 rounded-full border border-white/25 shadow backdrop-blur-sm">
                    Sakura Dojo
                </span>
            </div>
            <div id="level-subtitle" class="text-xs sm:text-sm font-bold text-slate-800 bg-white/85 backdrop-blur-sm px-3 py-1 rounded-full shadow-sm border border-white/60 w-fit">
                Drag to Curve &amp; Aim • Hit Any Body Part!
            </div>
        </div>

        <!-- Top-Right: Kill Counter Badge & Reset Button -->
        <div class="flex flex-col items-end gap-2.5 pointer-events-auto">
            <!-- Score / Head Counter Pill -->
            <div class="bg-white border-[2.5px] border-slate-800 rounded-full px-3 py-1 flex items-center gap-3 shadow-md min-w-[92px] justify-between">
                <!-- Green Pouty-Lips Googly Head SVG Icon -->
                <svg class="w-6 h-6 shrink-0" viewBox="0 0 36 36" fill="none">
                    <circle cx="18" cy="18" r="14" fill="#52d411" stroke="#1e293b" stroke-width="2.5"/>
                    <circle cx="12.5" cy="14.5" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
                    <circle cx="12.8" cy="14.5" r="2.3" fill="#0f172a"/>
                    <circle cx="23.5" cy="14.5" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
                    <circle cx="23.2" cy="14.5" r="2.3" fill="#0f172a"/>
                    <ellipse cx="18" cy="24" rx="5.5" ry="3.4" fill="#ff2e7e" stroke="#1e293b" stroke-width="1.5"/>
                    <line x1="13.5" y1="24" x2="22.5" y2="24" stroke="#881337" stroke-width="1.4"/>
                </svg>
                <span id="score-counter" class="font-extrabold text-slate-900 text-lg pr-1">0</span>
            </div>

            <!-- Remaining Enemies Pill -->
            <div class="bg-slate-900/80 text-white border border-white/25 rounded-full px-3 py-0.5 text-xs font-bold shadow">
                Targets Left: <span id="targets-left" class="text-emerald-400 font-extrabold">3</span>
            </div>

            <!-- Circular Restart Level Button + Audio Button -->
            <div class="flex items-center gap-2">
                <button id="btn-mute" title="Toggle Sound" class="w-10 h-10 rounded-full bg-white border-[2.5px] border-slate-800 flex items-center justify-center shadow-md hover:scale-105 active:scale-95 transition">
                    <svg id="icon-sound-on" class="w-5 h-5 text-slate-800" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/>
                    </svg>
                    <svg id="icon-sound-off" class="w-5 h-5 text-red-500 hidden" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM22 9l-6 6M16 9l6 6"/>
                    </svg>
                </button>
                <button id="btn-restart-top" title="Restart Level" class="w-10 h-10 rounded-full bg-white border-[2.5px] border-slate-800 flex items-center justify-center shadow-md hover:scale-105 active:scale-95 transition">
                    <svg class="w-5 h-5 text-slate-800" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom-Left Gun / Disc Toggle Button -->
    <div class="fixed bottom-10 left-3 sm:left-5 z-20 flex items-center gap-3">
        <!-- Gun Weapon Toggle Button -->
        <button id="btn-weapon-gun" class="btn-game-orange w-14 h-14 sm:w-16 sm:h-16 rounded-2xl flex flex-col items-center justify-center text-white relative group">
            <!-- Stylized Handgun SVG Icon -->
            <svg class="w-8 h-8 drop-shadow text-slate-900" viewBox="0 0 24 24" fill="currentColor">
                <path d="M2 7h15l2 2h3v4h-3.5l-1.5 1.5V16h-4v-1.5H9.5L7.5 20H3.5l1.5-5.5H2V7zm12 5.5v1.5h1.5v-1.5H14z"/>
            </svg>
            <span id="weapon-mode-badge" class="absolute -top-2 -right-2 bg-rose-500 text-white text-[10px] font-extrabold px-1.5 py-0.5 rounded-full border border-slate-900 shadow">
                DISC
            </span>
        </button>

        <div id="power-tooltip" class="bg-slate-900/80 backdrop-blur-md text-white text-xs font-bold px-3 py-1.5 rounded-xl border border-white/15 shadow-lg pointer-events-none">
            <div class="text-sky-300" id="disc-mode-title">Dojo Disc (Disc Mode)</div>
            <div class="text-white/80 text-[11px]" id="disc-mode-desc">Tap Gun icon to switch to Blaster Gun!</div>
        </div>
    </div>

    <!-- Bottom-Left Version Watermark (like 1.0.0 in video) -->
    <div class="fixed bottom-1.5 left-2 text-[11px] font-bold text-white/80 drop-shadow pointer-events-none z-10">
        1.0.0
    </div>

    <!-- Floating Hit Container -->
    <div id="floating-fx-container" class="fixed inset-0 pointer-events-none z-30"></div>

    <!-- LEVEL COMPLETE OVERLAY (Exact match to 0:04-0:05 in video) -->
    <div id="level-complete-modal" class="fixed inset-0 z-40 hidden flex-col items-center justify-between py-12 sm:py-16 bg-black/25 backdrop-blur-[2px]">
        <!-- Top Comic Title -->
        <div class="mt-2 sm:mt-4 flex flex-col items-center">
            <h1 id="modal-main-title" class="level-complete-title text-5xl sm:text-6xl md:text-7xl select-none">
                LEVEL<br>COMPLETE
            </h1>
            <p id="modal-sub-caption" class="mt-3 text-white font-extrabold text-sm sm:text-base bg-slate-900/80 px-4 py-1 rounded-full border border-white/20 shadow-lg">
                All targets sliced! Next stage awaits!
            </p>
        </div>

        <!-- Center Action Buttons ("Again" & "Continue") -->
        <div class="flex flex-col items-center gap-3.5 mb-20 sm:mb-24 w-56">
            <button id="btn-again" class="btn-game-orange w-44 py-2.5 rounded-full text-white font-extrabold text-xl flex items-center justify-center gap-2 tracking-wide">
                <span>Again</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
            </button>
            <button id="btn-continue" class="btn-game-green w-52 py-3 rounded-full text-white font-extrabold text-2xl flex items-center justify-center gap-2 tracking-wide">
                <span>Continue</span>
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        /* ============================================================================
         * SOUND ENGINE (Web Audio API - Matched to uploaded swoosh.mp3 & boing_poing.mp3)
         * ============================================================================ */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.noiseBuffer = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                if (this.ctx && !this.noiseBuffer) {
                    // Pre-generate white noise buffer for realistic air-whoosh synthesis
                    const sampleRate = this.ctx.sampleRate;
                    const length = Math.floor(sampleRate * 0.5);
                    this.noiseBuffer = this.ctx.createBuffer(1, length, sampleRate);
                    const data = this.noiseBuffer.getChannelData(0);
                    for (let i = 0; i < length; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                }
            }

            // 1st Sound (swoosh.mp3): Crisp, airy whip-swoosh when throwing the disc
            playThrow() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;

                // Filtered noise burst for the fast air-cutting "shhhwup!"
                if (this.noiseBuffer) {
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = this.noiseBuffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.Q.setValueAtTime(2.2, now);
                    filter.frequency.setValueAtTime(550, now);
                    filter.frequency.exponentialRampToValueAtTime(2800, now + 0.065);
                    filter.frequency.exponentialRampToValueAtTime(380, now + 0.21);

                    const nGain = this.ctx.createGain();
                    nGain.gain.setValueAtTime(0.001, now);
                    nGain.gain.linearRampToValueAtTime(0.55, now + 0.045);
                    nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

                    noise.connect(filter);
                    filter.connect(nGain);
                    nGain.connect(this.ctx.destination);

                    noise.start(now);
                    noise.stop(now + 0.23);
                }

                // Subtle pitched aerodynamic body underneath the air noise
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(190, now);
                osc.frequency.exponentialRampToValueAtTime(540, now + 0.06);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.21);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.24, now + 0.045);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.21);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.22);
            }

            // Crisp punchy gunshot sound when firing in Gun mode
            playGunshot() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;

                if (this.noiseBuffer) {
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = this.noiseBuffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(3200, now);
                    filter.frequency.exponentialRampToValueAtTime(280, now + 0.16);

                    const nGain = this.ctx.createGain();
                    nGain.gain.setValueAtTime(0.75, now);
                    nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);

                    noise.connect(filter);
                    filter.connect(nGain);
                    nGain.connect(this.ctx.destination);
                    noise.start(now);
                    noise.stop(now + 0.18);
                }

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(260, now);
                osc.frequency.exponentialRampToValueAtTime(48, now + 0.13);

                gain.gain.setValueAtTime(0.55, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            }

            // 2nd Sound (boing_poing.mp3): Comical resonant "boing-poing" spring wobble when enemy body spreads apart
            playSliceSplat() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;

                // Main carrier oscillator with resonant low-pass filter ("boing-oing-oing")
                const osc = this.ctx.createOscillator();
                const filter = this.ctx.createBiquadFilter();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                // Base pitch glides up slightly after initial pluck, just like a cartoon spring/jaw-harp boing
                osc.frequency.setValueAtTime(98, now);
                osc.frequency.exponentialRampToValueAtTime(215, now + 0.09);
                osc.frequency.exponentialRampToValueAtTime(155, now + 0.58);

                // Fast LFO wobble modulating both pitch and filter cutoff for the "poing-oing-oing" bounce
                const lfo = this.ctx.createOscillator();
                const lfoPitchGain = this.ctx.createGain();
                const lfoFilterGain = this.ctx.createGain();
                lfo.type = 'sine';
                lfo.frequency.setValueAtTime(22, now);
                lfo.frequency.linearRampToValueAtTime(14, now + 0.55);

                lfoPitchGain.gain.setValueAtTime(42, now);
                lfoPitchGain.gain.exponentialRampToValueAtTime(4, now + 0.55);

                lfoFilterGain.gain.setValueAtTime(650, now);
                lfoFilterGain.gain.exponentialRampToValueAtTime(80, now + 0.55);

                lfo.connect(lfoPitchGain);
                lfoPitchGain.connect(osc.frequency);

                // Resonant vowel-like filter sweep ("bwah-oing")
                filter.type = 'lowpass';
                filter.Q.setValueAtTime(9.5, now);
                filter.frequency.setValueAtTime(320, now);
                filter.frequency.exponentialRampToValueAtTime(1650, now + 0.07);
                filter.frequency.exponentialRampToValueAtTime(420, now + 0.58);

                lfo.connect(lfoFilterGain);
                lfoFilterGain.connect(filter.frequency);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.42, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.58);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                // Companion sine overtone for extra rubbery cartoon bounce
                const subOsc = this.ctx.createOscillator();
                const subGain = this.ctx.createGain();
                subOsc.type = 'triangle';
                subOsc.frequency.setValueAtTime(196, now);
                subOsc.frequency.exponentialRampToValueAtTime(430, now + 0.09);
                subOsc.frequency.exponentialRampToValueAtTime(310, now + 0.52);

                lfoPitchGain.connect(subOsc.frequency);

                subGain.gain.setValueAtTime(0.001, now);
                subGain.gain.linearRampToValueAtTime(0.25, now + 0.025);
                subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.52);

                subOsc.connect(subGain);
                subGain.connect(this.ctx.destination);

                osc.start(now);
                subOsc.start(now);
                lfo.start(now);

                osc.stop(now + 0.6);
                subOsc.stop(now + 0.54);
                lfo.stop(now + 0.6);
            }

            playBarrelSmash() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(32, now + 0.35);

                gain.gain.setValueAtTime(0.38, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.37);
            }

            playRicochet() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(980, now);
                osc.frequency.exponentialRampToValueAtTime(1750, now + 0.08);
                osc.frequency.exponentialRampToValueAtTime(520, now + 0.22);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.23);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.24);
            }

            playDefeat() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const notes = [392.0, 349.23, 311.13, 261.63];
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + idx * 0.11;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.32);
                });
            }

            playVictory() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + idx * 0.09;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.36);
                });
            }
        }

        function createSandstoneTileTexture(mortarHex = '#c59258', baseRGB = [232, 182, 125]) {
            const c = document.createElement('canvas');
            c.width = 512;
            c.height = 512;
            const ctx = c.getContext('2d');

            ctx.fillStyle = mortarHex;
            ctx.fillRect(0, 0, 512, 512);

            const rows = 4;
            const cols = 4;
            const pad = 6;
            const w = 512 / cols;
            const h = 512 / rows;

            for (let r = 0; r < rows; r++) {
                for (let col = 0; col < cols; col++) {
                    const x = col * w + pad;
                    const y = r * h + pad;
                    const tw = w - pad * 2;
                    const th = h - pad * 2;

                    const delta = Math.floor((Math.random() - 0.5) * 18);
                    const cr = Math.min(255, Math.max(0, baseRGB[0] + delta));
                    const cg = Math.min(255, Math.max(0, baseRGB[1] + delta));
                    const cb = Math.min(255, Math.max(0, baseRGB[2] + delta));
                    ctx.fillStyle = `rgb(${cr}, ${cg}, ${cb})`;

                    ctx.beginPath();
                    ctx.roundRect(x, y, tw, th, 10);
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            }

            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(9, 9);
            tex.anisotropy = 4;
            return tex;
        }

            function createRailingSegment(x1, z1, x2, z2, segments = 4) {
                const group = new THREE.Group();
                const dx = x2 - x1;

                const botBar = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22, len), envMaterials.darkWood);
                botBar.position.y = 0.11;

                for (let i = 0; i <= segments; i++) {

                    const post = new THREE.Mesh(new THREE.BoxGeometry(0.32, 1.5, 0.32), envMaterials.redWood);

        function createSwimShortsTexture(patternType = 'DUCKS', bgHex = '#116315') {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 256;
            const ctx = c.getContext('2d');

            ctx.fillStyle = bgHex;
            ctx.fillRect(0, 0, 256, 256);

            if (patternType === 'FLOWERS') {
                // Yellow smiley-face daisy flowers (Image 4)
                const spots = [
                    [45, 50], [125, 40], [205, 55],
                    [30, 125], [95, 115], [170, 125], [230, 130],
                    [55, 200], [135, 195], [205, 205]
                ];
                spots.forEach(([cx, cy]) => {
                    ctx.fillStyle = '#fbbf24';
                    for (let p = 0; p < 7; p++) {
                        const ang = (p / 7) * Math.PI * 2;
                        ctx.beginPath();
                        ctx.arc(cx + Math.cos(ang) * 14, cy + Math.sin(ang) * 14, 9, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.fillStyle = '#f59e0b';
                    ctx.beginPath();
                    ctx.arc(cx, cy, 11, 0, Math.PI * 2);
                    ctx.fill();

                    // Smiley eyes & mouth
                    ctx.fillStyle = '#1e293b';
                    ctx.beginPath();
                    ctx.arc(cx - 3.5, cy - 2.5, 1.7, 0, Math.PI * 2);
                    ctx.arc(cx + 3.5, cy - 2.5, 1.7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.arc(cx, cy + 1, 5, 0.15 * Math.PI, 0.85 * Math.PI);
                    ctx.stroke();
                });
            } else if (patternType === 'HEARTS_ORANGE') {
                // Orange swim shorts with white hearts (New Image 3 Right Character)
                ctx.fillStyle = '#ffffff';
                const heartSpots = [
                    [42, 48], [128, 42], [208, 52],
                    [78, 118], [168, 114], [28, 134],
                    [52, 200], [140, 196], [214, 198]
                ];
                heartSpots.forEach(([hx, hy]) => {
                    ctx.beginPath();
                    ctx.moveTo(hx, hy + 12);
                    ctx.bezierCurveTo(hx - 16, hy + 2, hx - 16, hy - 12, hx - 6, hy - 12);
                    ctx.bezierCurveTo(hx - 1, hy - 12, hx, hy - 6, hx, hy - 4);
                    ctx.bezierCurveTo(hx, hy - 6, hx + 1, hy - 12, hx + 6, hy - 12);
                    ctx.bezierCurveTo(hx + 16, hy - 12, hx + 16, hy + 2, hx, hy + 12);
                    ctx.fill();
                });
            } else if (patternType === 'PINK_DAISY_DRESS') {
                // Pink floral dress pattern with white petals & yellow centers (New Image 2)
                const daisySpots = [
                    [40, 42], [118, 36], [198, 46],
                    [72, 102], [156, 98], [228, 112],
                    [36, 168], [112, 174], [190, 168],
                    [68, 226], [154, 228], [224, 224]
                ];
                daisySpots.forEach(([cx, cy]) => {
                    ctx.fillStyle = '#ffffff';
                    for (let p = 0; p < 8; p++) {
                        const ang = (p / 8) * Math.PI * 2;
                        ctx.beginPath();
                        ctx.ellipse(
                            cx + Math.cos(ang) * 11,
                            cy + Math.sin(ang) * 11,
                            7, 4.2, ang, 0, Math.PI * 2
                        );
                        ctx.fill();
                    }
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    ctx.arc(cx, cy, 6.5, 0, Math.PI * 2);
                    ctx.fill();
                });
            } else {
                // White polka dots + Yellow rubber ducks (Existing Images 1, 2, 3)
                ctx.fillStyle = '#ffffff';
                for (let i = 0; i < 28; i++) {
                    const dx = (i * 47 + 19) % 240 + 8;
                    const dy = (i * 83 + 29) % 240 + 8;
                    ctx.beginPath();
                    ctx.arc(dx, dy, 4.2, 0, Math.PI * 2);
                    ctx.fill();
                }

                const duckSpots = [
                    [44, 48], [136, 44], [212, 56],
                    [82, 118], [176, 115], [32, 138],
                    [52, 204], [142, 198], [216, 196]
                ];
                duckSpots.forEach(([x, y]) => {
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    ctx.ellipse(x, y + 6, 15, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x - 7, y - 5, 8.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(x + 11, y + 2);
                    ctx.lineTo(x + 19, y - 4);
                    ctx.lineTo(x + 14, y + 10);
                    ctx.fill();
                    ctx.fillStyle = '#f97316';
                    ctx.beginPath();
                    ctx.ellipse(x - 16, y - 4, 4.5, 2.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#0f172a';
                    ctx.beginPath();
                    ctx.arc(x - 9, y - 7, 1.6, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(1.5, 1);
            return tex;
        }

            ctx.bezierCurveTo(64, 34, 74, 22, 86, 26);
