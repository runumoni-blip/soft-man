            resetPoseDefaults() {
                const { torso, head, pelvis, leftArm, rightArm, leftLeg, rightLeg } = this.parts;
                const { leftElbow, rightElbow, leftKnee, rightKnee } = this.joints;
                if (torso) { torso.position.set(0, 1.72, 0); torso.rotation.set(0, 0, 0); }
                if (pelvis) { pelvis.position.set(0, 1.12, 0); pelvis.rotation.set(0, 0, 0); }
                if (head) { head.position.set(0, 2.52, 0); head.rotation.set(0, 0, 0); }
                if (leftArm) { leftArm.position.set(-0.52, 2.02, 0); leftArm.rotation.set(0, 0, 0); }
                if (rightArm) { rightArm.position.set(0.52, 2.02, 0); rightArm.rotation.set(0, 0, 0); }
                if (leftLeg) { leftLeg.position.set(-0.21, 0.98, 0); leftLeg.rotation.set(0, 0, 0); }
                if (rightLeg) { rightLeg.position.set(0.21, 0.98, 0); rightLeg.rotation.set(0, 0, 0); }
                if (leftElbow) leftElbow.rotation.set(-0.18, 0, 0);
                if (rightElbow) rightElbow.rotation.set(-0.18, 0, 0);
                if (leftKnee) leftKnee.rotation.set(0, 0, 0);
                if (rightKnee) rightKnee.rotation.set(0, 0, 0);
                this.root.rotation.set(0, 0, 0);
            }

            animateFaceAndEyes(dt, t) {
                // 1. Realistic Eye Blinking & Pupil Tracking
                this.blinkTimer -= dt;
                if (this.blinkTimer <= 0) {
                    this.blinkDuration = 0.14;
                    this.blinkTimer = 1.8 + Math.random() * 2.8;
                }
                let eyeScaleY = 1.0;
                if (this.blinkDuration > 0) {
                    this.blinkDuration -= dt;
                    eyeScaleY = 0.12;
                }
                this.eyelids.forEach(lid => {
                    lid.scale.y = THREE.MathUtils.lerp(lid.scale.y, eyeScaleY, 0.45);
                });

                // Pupils dart around and track incoming discs!
                let lookX = Math.sin(t * 0.45) * 0.022;
                let lookY = Math.cos(t * 0.32) * 0.016;
                if (activeDiscs.length > 0 && activeDiscs[0].active) {
                    const dPos = activeDiscs[0].group.position;
                    lookX = THREE.MathUtils.clamp((dPos.x - this.root.position.x) * 0.008, -0.03, 0.03);
                    lookY = THREE.MathUtils.clamp((dPos.y - 2.2) * 0.008, -0.025, 0.025);
                }
                this.pupils.forEach((p, idx) => {
                    p.position.x = (idx === 0 ? 0.01 : -0.01) + lookX;
                    p.position.y = lookY;
                });

                // 2. Realistic Lip Chatter / Breathing & Puffed Cheek Pulsing
                if (this.upperLip && this.lowerLip) {
                    const talk = (Math.sin(t * 2.6) + 1) * 0.5;
                    this.upperLip.position.y = 0.036 + talk * 0.012;
                    this.lowerLip.position.y = -0.04 + -talk * 0.014;
                    this.lipsGroup.scale.x = 1.0 + Math.sin(t * 1.3) * 0.06;
                }
                if (this.puffedCheeks) {
                    const puffPulse = 1.0 + Math.sin(t * 1.8) * 0.09;
                    this.puffedCheeks.forEach(c => c.scale.set(1.12 * puffPulse, 0.95 * puffPulse, 1.05 * puffPulse));
                }
            }

            update(dt) {
                if (!this.alive) return;

                this.animPhase += dt * 7.5;
                const t = this.animPhase;
                this.animateFaceAndEyes(dt, t);

                if (this.behavior === 'BIKE_RIDER' || this.behavior === 'MOUNTED') {
                    return;
                }

                this.resetPoseDefaults();
                const { torso, head, pelvis, leftArm, rightArm, leftLeg, rightLeg } = this.parts;
                const { leftElbow, rightElbow, leftKnee, rightKnee } = this.joints;

                switch (this.behavior) {
                    case 'MORNING_JOG_WAVE': {
                        // Level 1: Realistic morning jog with articulated knee lift & friendly hand wave
                        this.root.position.z += this.walkSpeed * dt;
                        const s = Math.sin(t);
                        const c = Math.cos(t);
                        this.root.position.y = Math.abs(s) * 0.16;
                        if (leftLeg) leftLeg.rotation.x = s * 0.65;
                        if (rightLeg) rightLeg.rotation.x = -s * 0.65;
                        if (leftKnee) leftKnee.rotation.x = Math.max(0, -s) * 0.85;
                        if (rightKnee) rightKnee.rotation.x = Math.max(0, s) * 0.85;
                        if (leftArm) leftArm.rotation.x = -s * 0.55;
                        if (leftElbow) leftElbow.rotation.x = -0.55;
                        // Right hand raised waving cheerfully at the player
                        if (rightArm) {
                            rightArm.rotation.x = -2.35;
                            rightArm.rotation.z = -0.45 + Math.sin(t * 1.8) * 0.32;
                        }
                        if (rightElbow) rightElbow.rotation.z = Math.sin(t * 1.8) * 0.35;
                        if (torso) torso.rotation.y = s * 0.15;
                        if (head) head.rotation.z = c * 0.07;
                        break;
                    }

                    case 'GOLDEN_POT_BALANCE_WALK': {
                        // Level 3 (New Image 4): Balancing ornate Golden Pot on head with right hand holding pot rim!
                        this.root.position.z += this.walkSpeed * 0.65 * dt;
                        this.root.position.x = this.initialX + Math.sin(t * 0.3) * 1.4;
                        const step = Math.sin(t * 0.9);
                        this.root.position.y = Math.abs(step) * 0.08;
                        if (leftLeg) leftLeg.rotation.x = step * 0.45;
                        if (rightLeg) rightLeg.rotation.x = -step * 0.45;
                        if (leftKnee) leftKnee.rotation.x = Math.max(0, -step) * 0.55;
                        if (rightKnee) rightKnee.rotation.x = Math.max(0, step) * 0.55;

                        // Right arm raised up with bent elbow so hand touches the golden pot just like Image 4!
                        if (rightArm) {
                            rightArm.rotation.z = -2.15;
                            rightArm.rotation.x = -0.25;
                        }
                        if (rightElbow) {
                            rightElbow.rotation.z = 1.45;
                            rightElbow.rotation.x = -0.2;
                        }
                        // Left arm extended slightly out for balance
                        if (leftArm) {
                            leftArm.rotation.z = 0.45 + Math.sin(t * 0.8) * 0.18;
                            leftArm.rotation.x = Math.cos(t * 0.8) * 0.15;
                        }
                        const wobble = Math.sin(t * 0.7) * 0.08;
                        if (head) head.rotation.z = wobble;
                        if (this.goldenPotMesh) {
                            this.goldenPotMesh.rotation.z = -wobble * 1.5;
                        }
                        break;
                    }

                    case 'FLORAL_DRESS_TWIRL': {
                        // Level 4 (New Image 2): Graceful ballet twirl, hip sway & expressive arm ribbons
                        const danceT = t * 0.55;
                        this.root.position.x = this.initialX + Math.sin(danceT * 0.7) * 2.1;
                        this.root.position.y = Math.abs(Math.sin(danceT * 2)) * 0.24;
                        this.root.rotation.y = Math.sin(danceT * 0.8) * Math.PI * 0.65;

                        if (pelvis) pelvis.rotation.z = Math.sin(danceT * 2) * 0.18;
                        if (torso) torso.rotation.z = -Math.sin(danceT * 2) * 0.12;
                        if (leftArm) {
                            leftArm.rotation.z = 1.35 + Math.sin(danceT * 2) * 0.45;
                            leftArm.rotation.x = -0.4;
                        }
                        if (rightArm) {
                            rightArm.rotation.z = -1.35 - Math.cos(danceT * 2) * 0.45;
                            rightArm.rotation.x = -0.4;
                        }
                        if (leftElbow) leftElbow.rotation.z = -0.5;
                        if (rightElbow) rightElbow.rotation.z = 0.5;
                        if (leftLeg) leftLeg.rotation.z = Math.max(0, Math.sin(danceT * 2)) * 0.45;
                        if (rightLeg) rightLeg.rotation.z = -Math.max(0, -Math.sin(danceT * 2)) * 0.45;
                        if (head) head.rotation.y = -this.root.rotation.y * 0.35;
                        break;
                    }

                    case 'SUMMER_BROS_STRUT': {
                        // Level 5 (New Image 3): Cool Heart-Sunglasses Summer Duo (crossed arms & hands-on-hips strut)
                        const beat = Math.sin(t * 0.75);
                        this.root.position.x = this.initialX + Math.sin(t * 0.28) * 1.8;

                        if (this.archetype.lookStyle === 'ORANGE_HEART_SHADES') {
                            // Right Bro from Image 3: Arms crossed confidently over chest!
                            if (leftArm) { leftArm.rotation.x = -1.15; leftArm.rotation.y = 0.65; }
                            if (rightArm) { rightArm.rotation.x = -1.15; rightArm.rotation.y = -0.65; }
                            if (leftElbow) { leftElbow.rotation.z = -1.25; }
                            if (rightElbow) { rightElbow.rotation.z = 1.25; }
                        } else {
                            // Left Bro from Image 3: Hands tucked casually on hips & one knee popped!
                            if (leftArm) { leftArm.rotation.z = 0.55; leftArm.rotation.x = 0.15; }
                            if (rightArm) { rightArm.rotation.z = -0.55; rightArm.rotation.x = 0.15; }
                            if (leftElbow) { leftElbow.rotation.z = -1.15; }
                            if (rightElbow) { rightElbow.rotation.z = 1.15; }
                        }
                        if (pelvis) pelvis.rotation.z = beat * 0.12;
                        if (torso) {
                            torso.rotation.y = beat * 0.22;
                            torso.rotation.x = -0.06;
                        }
                        if (rightLeg) rightLeg.rotation.x = -Math.abs(beat) * 0.35;
                        if (rightKnee) rightKnee.rotation.x = Math.abs(beat) * 0.65;
                        if (head) {
                            head.rotation.z = beat * 0.14;
                            head.position.y = 2.52 + Math.abs(beat) * 0.05;
                        }
                        break;
                    }

                    case 'ROYAL_HELMET_KATA': {
                        // Level 6 (New Image 5): Golden Helmet Knights performing martial-arts lunges & high kicks
                        const kata = Math.sin(t * 0.65);
                        this.root.position.x = this.initialX + Math.sin(t * 0.32) * 2.2;
                        this.root.position.z = this.initialZ + Math.cos(t * 0.32) * 0.9;

                        if (kata > 0.25) {
                            // High side martial-arts kick!
                            const kickAmt = (kata - 0.25) / 0.75;
                            if (rightLeg) {
                                rightLeg.rotation.x = -kickAmt * 1.35;
                                rightLeg.rotation.z = -kickAmt * 0.45;
                            }
                            if (torso) torso.rotation.x = kickAmt * 0.25;
                        } else {
                            // Deep horse-stance punch combo
                            this.root.position.y = -0.18;
                            if (leftLeg) leftLeg.rotation.x = -0.45;
                            if (rightLeg) rightLeg.rotation.x = 0.35;
                            if (leftKnee) leftKnee.rotation.x = 0.65;
                            if (rightKnee) rightKnee.rotation.x = 0.45;
                        }
                        if (leftArm) leftArm.rotation.x = -1.4 + Math.sin(t * 1.4) * 0.65;
                        if (rightArm) rightArm.rotation.x = -1.4 - Math.sin(t * 1.4) * 0.65;
                        if (leftElbow) leftElbow.rotation.x = -0.45 - Math.max(0, -Math.sin(t * 1.4)) * 0.8;
                        if (rightElbow) rightElbow.rotation.x = -0.45 - Math.max(0, Math.sin(t * 1.4)) * 0.8;
                        break;
                    }

                    case 'JUMPING_JACKS_FITNESS': {
                        // Level 7: Synchronized Jumping Jacks & Squat Fitness Workout
                        const jj = (Math.sin(t * 0.95) + 1) * 0.5; // 0 to 1
                        this.root.position.y = jj * 0.58;
                        if (leftArm) leftArm.rotation.z = 0.2 + jj * 2.45;
                        if (rightArm) rightArm.rotation.z = -0.2 - jj * 2.45;
                        if (leftElbow) leftElbow.rotation.z = -jj * 0.45;
                        if (rightElbow) rightElbow.rotation.z = jj * 0.45;
                        if (leftLeg) leftLeg.rotation.z = jj * 0.52;
                        if (rightLeg) rightLeg.rotation.z = -jj * 0.52;
                        if (leftKnee) leftKnee.rotation.x = (1 - jj) * 0.45;
                        if (rightKnee) rightKnee.rotation.x = (1 - jj) * 0.45;
                        if (head) head.rotation.x = -jj * 0.18;
                        break;
                    }

                    case 'MOONWALK_BREAKDANCE': {
                        // Level 15: Smooth Moonwalk Glide & Hip-Hop Groove
                        const glide = Math.sin(t * 0.4);
                        this.root.position.x = this.initialX + glide * 3.2;
                        this.root.rotation.y = glide >= 0 ? Math.PI * 0.42 : -Math.PI * 0.42;

                        const slideCycle = Math.sin(t * 1.3);
                        if (leftLeg) leftLeg.rotation.x = slideCycle * 0.55;
                        if (rightLeg) rightLeg.rotation.x = -slideCycle * 0.55;
                        if (leftKnee) leftKnee.rotation.x = Math.max(0, slideCycle) * 0.95;
                        if (rightKnee) rightKnee.rotation.x = Math.max(0, -slideCycle) * 0.95;
                        if (head) head.position.z = 0.08 + Math.sin(t * 2.6) * 0.06;
                        if (torso) torso.rotation.x = 0.18 * Math.sin(t * 1.3);
                        if (leftArm) leftArm.rotation.x = -0.6 + slideCycle * 0.5;
                        if (rightArm) rightArm.rotation.x = -0.6 - slideCycle * 0.5;
                        break;
                    }

                    default: {
                        // Fallback dynamic evasive run with full knee/elbow articulation
                        const s = Math.sin(t);
                        this.root.position.x = this.initialX + Math.sin(t * 0.35) * 2.8;
                        this.root.position.y = Math.abs(s) * 0.15;
                        if (leftLeg) leftLeg.rotation.x = s * 0.65;
                        if (rightLeg) rightLeg.rotation.x = -s * 0.65;
                        if (leftKnee) leftKnee.rotation.x = Math.max(0, -s) * 0.75;
                        if (rightKnee) rightKnee.rotation.x = Math.max(0, s) * 0.75;
                        if (leftArm) leftArm.rotation.x = -s * 0.55;
                        if (rightArm) rightArm.rotation.x = s * 0.55;
                        break;
                    }
                }

                if (this.root.position.z > 8.2) {
                    this.root.position.z = -7.8;
                }
            }

            sliceAt(hitWorldPos, discVelocity, hitZone = 'BODY') {
                if (!this.alive) return;
                this.alive = false;
                totalKills++;
                updateScoreHUD();
                sound.playSliceSplat();

                spawnGreenSplatter(hitWorldPos, 38, this.gooMat);
                spawnFloorPuddle(this.root.position.x, this.root.position.z, 1.35 * this.scale, this.gooMat);

                const hitLabels = hitZone === 'HEAD'
                    ? ['HEADSHOT!', 'DECAPITATED!', 'BULLSEYE!']
                    : (hitZone === 'LEGS' ? ['LEG SWEEP!', 'TIMBER!', 'SLICED!'] : ['SLICED!', 'CRITICAL!', 'KO!']);
                spawnFloatingText(hitWorldPos, hitLabels[Math.floor(Math.random() * hitLabels.length)]);

                slowMoFactor = 0.35;
                slowMoTimer = 0.22;
                cameraShake = 0.28;

                // Detach Golden Pot or Royal Helmet as independent 3D physics objects if worn!
                [this.goldenPotMesh, this.helmetMesh].forEach(propMesh => {
                    if (propMesh && propMesh.parent) {
                        const propWorldPos = new THREE.Vector3();
                        const propWorldQuat = new THREE.Quaternion();
                        const propWorldScale = new THREE.Vector3();
                        propMesh.getWorldPosition(propWorldPos);
                        propMesh.getWorldQuaternion(propWorldQuat);
                        propMesh.getWorldScale(propWorldScale);

                        scene.attach(propMesh);
                        propMesh.position.copy(propWorldPos);
                        propMesh.quaternion.copy(propWorldQuat);
                        propMesh.scale.copy(propWorldScale);

                        physicsChunks.push({
                            mesh: propMesh,
                            vel: new THREE.Vector3(
                                discVelocity.x * 0.22 + (Math.random() - 0.5) * 8,
                                8.5 + Math.random() * 4,
                                discVelocity.z * 0.18 + (Math.random() - 0.5) * 7
                            ),
                            rotVel: new THREE.Vector3((Math.random() - 0.5) * 16, (Math.random() - 0.5) * 16, (Math.random() - 0.5) * 16),
                            radius: 0.32,
                            bounces: 0,
                            bleedTimer: 0,
                            canKnockEnemies: true
                        });
                    }
                });

                const partKeys = Object.keys(this.parts);
                partKeys.forEach(key => {
                    const part = this.parts[key];
                    if (!part) return;

                    const worldPos = new THREE.Vector3();
                    const worldQuat = new THREE.Quaternion();
                    const worldScale = new THREE.Vector3();
                    part.matrixWorldNeedsUpdate = true;
                    part.getWorldPosition(worldPos);
                    part.getWorldQuaternion(worldQuat);
                    part.getWorldScale(worldScale);

                    scene.attach(part);
                    part.position.copy(worldPos);
                    part.quaternion.copy(worldQuat);
                    part.scale.copy(worldScale);

                    const sliceCap = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), this.gooMat);
                    sliceCap.scale.set(1, 0.35, 1);
                    part.add(sliceCap);

                    const distToHit = worldPos.distanceTo(hitWorldPos);
                    const impulseScale = Math.max(0.3, 1.75 - distToHit * 0.55);

                    const vel = new THREE.Vector3(
                        discVelocity.x * 0.24 * impulseScale + (Math.random() - 0.5) * 6.5,
                        (key === 'head' ? 8.2 : 4.5) * impulseScale + Math.random() * 3.0,
                        discVelocity.z * 0.18 * impulseScale + (Math.random() - 0.5) * 5.0
                    );

                    const rotVel = new THREE.Vector3(
                        (Math.random() - 0.5) * 15,
                        (Math.random() - 0.5) * 15,
                        (Math.random() - 0.5) * 15
                    );

                    physicsChunks.push({
                        mesh: part,
                        vel: vel,
                        rotVel: rotVel,
                        radius: key === 'torso' ? 0.38 : 0.24,
                        bounces: 0,
                        bleedTimer: 0.45,
                        gooMat: this.gooMat,
                        canKnockEnemies: key === 'torso' || key === 'head'
                    });
                });

                scene.remove(this.root);
                checkLevelCompletion();
            }

            destroyClean() {
                scene.remove(this.root);
            }
        }

        /* ============================================================================
         * NEW PHYSICS CONTRAPTIONS FOR UNIQUE PER-LEVEL ACTIVITIES:
         * 1. BrickWellContraption (New Image 1 - Green Brick Well Pop-Up & Breakable Bricks)
         * 2. TrampolineContraption (Springy Trampoline Somersaults)
         * 3. WeightliftingContraption (Heavy Physics Barbell Clean-and-Jerk)
         * 4. TightropeContraption (High-Wire Rope & Balance Pole Walk)
         * 5. HulaHoopContraption (3D Spinning Physics Hula-Hoop)
         * ============================================================================ */
        class BrickWellContraption {
            constructor(x, z, archetypeKey = 'WELL_PUFFER', phaseOffset = 0) {
                this.group = new THREE.Group();
                this.group.position.set(x, 0, z);
                this.phase = phaseOffset;
                this.wellIntact = true;
                this.bricks = [];

                const brickMat1 = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.55 });
                const brickMat2 = new THREE.MeshStandardMaterial({ color: 0x166534, roughness: 0.6 });
                const wellHoleMat = new THREE.MeshBasicMaterial({ color: 0x052e16 });

                // Inner dark shaft cylinder
                const innerShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.76, 0.76, 1.48, 18), wellHoleMat);
                innerShaft.position.y = 0.74;
                this.group.add(innerShaft);

                // 5 staggered rings of beveled 3D green bricks matching New Image 1
                const rows = 5;
                const bricksPerRow = 10;
                const radius = 0.84;
                for (let r = 0; r < rows; r++) {
                    const ry = 0.16 + r * 0.27;
                    for (let b = 0; b < bricksPerRow; b++) {
                        const ang = ((b + (r % 2) * 0.5) / bricksPerRow) * Math.PI * 2;
                        const brick = new THREE.Mesh(
                            new THREE.BoxGeometry(0.46, 0.24, 0.22),
                            (r + b) % 2 === 0 ? brickMat1 : brickMat2
                        );
                        brick.position.set(Math.cos(ang) * radius, ry, Math.sin(ang) * radius);
                        brick.rotation.y = -ang + Math.PI / 2;
                        brick.castShadow = true;
                        this.group.add(brick);
                        this.bricks.push(brick);
                    }
                }

                // Thick top rim lip of the green brick well
                const topRim = new THREE.Mesh(new THREE.TorusGeometry(0.86, 0.13, 12, 24), brickMat1);
                topRim.rotation.x = Math.PI / 2;
                topRim.position.y = 1.52;
                topRim.castShadow = true;
                this.group.add(topRim);
                this.bricks.push(topRim);

                scene.add(this.group);

                this.rider = new GooglyNinja({
                    x: x,
                    y: 0.1,
                    z: z,
                    behavior: 'MOUNTED',
                    speed: 0,
                    scale: 0.96,
                    archetypeKey: archetypeKey
                });
                enemies.push(this.rider);
                this.update(0);
            }

            smashWell(discVel) {
                if (!this.wellIntact) return;
                this.wellIntact = false;
                sound.playBarrelSmash();
                cameraShake = 0.3;

                // Send 3D green bricks flying with physics!
                this.bricks.forEach((bMesh, idx) => {
                    if (idx % 2 === 0) {
                        const wPos = new THREE.Vector3();
                        bMesh.getWorldPosition(wPos);
                        scene.attach(bMesh);
                        bMesh.position.copy(wPos);
                        physicsChunks.push({
                            mesh: bMesh,
                            vel: new THREE.Vector3(
                                discVel.x * 0.15 + (Math.random() - 0.5) * 9,
                                3.5 + Math.random() * 5,
                                discVel.z * 0.15 + (Math.random() - 0.5) * 9
                            ),
                            rotVel: new THREE.Vector3((Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14),
                            radius: 0.18,
                            bounces: 0,
                            bleedTimer: 0,
                            canKnockEnemies: false
                        });
                    }
                });
                scene.remove(this.group);
            }

            update(dt) {
                this.phase += dt * 2.4;
                if (!this.rider || !this.rider.alive) return;

                if (this.wellIntact) {
                    // Pop up out of the well, puff cheeks, look left/right, and duck slightly!
                    const popWave = Math.sin(this.phase);
                    const yOffset = THREE.MathUtils.clamp(popWave * 0.45, -0.55, 0.25);
                    this.rider.root.position.set(this.group.position.x, yOffset, this.group.position.z);

                    // Hands gripping or resting near the well rim like Image 1
                    const { leftArm, rightArm, head } = this.rider.parts;
                    const { leftElbow, rightElbow } = this.rider.joints;
                    if (leftArm) { leftArm.rotation.z = 0.18; leftArm.rotation.x = -0.22; }
                    if (rightArm) { rightArm.rotation.z = -0.18; rightArm.rotation.x = -0.22; }
                    if (leftElbow) leftElbow.rotation.x = -0.35;
                    if (rightElbow) rightElbow.rotation.x = -0.35;
                    if (head) head.rotation.y = Math.cos(this.phase * 1.3) * 0.38;
                } else {
                    // Well was smashed! Character stands exposed on the floor
                    this.rider.root.position.y = THREE.MathUtils.lerp(this.rider.root.position.y, 0, 0.15);
                }
            }

            destroyClean() {
                scene.remove(this.group);
            }
        }

        class TrampolineContraption {
            constructor(x, z, archetypeKey, phaseOffset = 0) {
                this.group = new THREE.Group();
                this.group.position.set(x, 0, z);
                this.phase = phaseOffset;

                const frameMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.7, roughness: 0.3 });
                const matFabric = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.4 });

                const ring = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.09, 10, 24), frameMat);
                ring.rotation.x = Math.PI / 2;
                ring.position.y = 0.45;
                this.group.add(ring);

                this.bouncePad = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 1.05, 0.06, 20), matFabric);
                this.bouncePad.position.y = 0.45;
                this.bouncePad.receiveShadow = true;
                this.group.add(this.bouncePad);

                for (let l = 0; l < 4; l++) {
                    const ang = (l / 4) * Math.PI * 2;
                    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.45, 8), frameMat);
                    leg.position.set(Math.cos(ang) * 1.05, 0.22, Math.sin(ang) * 1.05);
                    this.group.add(leg);
                }

                scene.add(this.group);

                this.rider = new GooglyNinja({
                    x: x,
                    y: 0.48,
                    z: z,
                    behavior: 'MOUNTED',
                    speed: 0,
                    scale: 0.96,
                    archetypeKey: archetypeKey
                });
                enemies.push(this.rider);
                this.update(0);
            }

            update(dt) {
                this.phase += dt * 3.1;
                if (!this.rider || !this.rider.alive) return;

                const sinWave = Math.sin(this.phase);
                const bounceHeight = Math.max(0, sinWave) * 2.85;
                this.bouncePad.position.y = 0.45 - Math.max(0, -sinWave) * 0.14;

                this.rider.root.position.set(this.group.position.x, 0.48 + bounceHeight, this.group.position.z);

                // Perform a full 360° backflip at the apex of the jump!
                if (sinWave > 0.2) {
                    const flipProgress = (sinWave - 0.2) / 0.8;
                    this.rider.root.rotation.x = -flipProgress * Math.PI * 2;
                    if (this.rider.parts.leftArm) this.rider.parts.leftArm.rotation.z = 1.6;
                    if (this.rider.parts.rightArm) this.rider.parts.rightArm.rotation.z = -1.6;
                    if (this.rider.joints.leftKnee) this.rider.joints.leftKnee.rotation.x = 1.1;
                    if (this.rider.joints.rightKnee) this.rider.joints.rightKnee.rotation.x = 1.1;
                } else {
                    this.rider.root.rotation.x = 0;
                    if (this.rider.joints.leftKnee) this.rider.joints.leftKnee.rotation.x = 0.65;
                    if (this.rider.joints.rightKnee) this.rider.joints.rightKnee.rotation.x = 0.65;
                }
            }

            destroyClean() {
                scene.remove(this.group);
            }
        }

        class WeightliftingContraption {
            constructor(x, z, archetypeKey, phaseOffset = 0) {
                this.phase = phaseOffset;
                this.barbellReleased = false;

                // Build heavy 3D physics barbell with plates
                this.barbell = new THREE.Group();
                const chromeMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.85, roughness: 0.2 });
                const plateMatRed = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.4 });
                const plateMatBlue = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.4 });

                const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.5, 10), chromeMat);
                bar.rotation.z = Math.PI / 2;
                bar.castShadow = true;
                this.barbell.add(bar);

                [-1, 1].forEach(side => {
                    const innerPlate = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.1, 16), plateMatRed);
                    innerPlate.rotation.z = Math.PI / 2;
                    innerPlate.position.x = side * 0.92;
                    innerPlate.castShadow = true;
                    this.barbell.add(innerPlate);

                    const outerPlate = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.08, 16), plateMatBlue);
                    outerPlate.rotation.z = Math.PI / 2;
                    outerPlate.position.x = side * 1.04;
                    this.barbell.add(outerPlate);
                });

                scene.add(this.barbell);

                this.lifter = new GooglyNinja({
                    x: x,
                    y: 0,
                    z: z,
                    behavior: 'MOUNTED',
                    speed: 0,
                    scale: 1.04,
                    archetypeKey: archetypeKey
                });
                enemies.push(this.lifter);
                this.update(0);
            }

            update(dt) {
                this.phase += dt * 2.5;
                if (!this.lifter || !this.lifter.alive) {
                    if (!this.barbellReleased) {
                        this.barbellReleased = true;
                        physicsChunks.push({
                            mesh: this.barbell,
                            vel: new THREE.Vector3((Math.random() - 0.5) * 3, 2.5, (Math.random() - 0.5) * 3),
                            rotVel: new THREE.Vector3(2, 1, 4),
                            radius: 0.38,
                            bounces: 0,
                            bleedTimer: 0,
                            canKnockEnemies: true
                        });
                    }
                    return;
                }

                // Overhead press cycle + deep knee bend
                const lift = (Math.sin(this.phase) + 1) * 0.5; // 0 (chest) to 1 (overhead)
                const squat = Math.max(0, -Math.sin(this.phase)) * 0.22;
                this.lifter.root.position.y = -squat;

                const { leftArm, rightArm, leftLeg, rightLeg, head } = this.lifter.parts;
                const { leftElbow, rightElbow, leftKnee, rightKnee } = this.lifter.joints;

                if (leftLeg) leftLeg.rotation.x = -squat * 2.2;
                if (rightLeg) rightLeg.rotation.x = -squat * 2.2;
                if (leftKnee) leftKnee.rotation.x = squat * 4.2;
                if (rightKnee) rightKnee.rotation.x = squat * 4.2;

                if (leftArm) leftArm.rotation.x = -1.45 - lift * 1.65;
                if (rightArm) rightArm.rotation.x = -1.45 - lift * 1.65;
                if (leftElbow) leftElbow.rotation.x = -(1 - lift) * 1.35;
                if (rightElbow) rightElbow.rotation.x = -(1 - lift) * 1.35;
                if (head) head.rotation.x = -lift * 0.22;

                const barY = 2.05 - squat + lift * 1.05;
                this.barbell.position.set(this.lifter.root.position.x, barY, this.lifter.root.position.z + 0.36 * (1 - lift * 0.6));
                this.barbell.rotation.z = Math.sin(this.phase * 4) * 0.04;
            }

            destroyClean() {
                scene.remove(this.barbell);
            }
        }

        class TightropeContraption {
            constructor(z, archetypeA, archetypeB) {
                this.group = new THREE.Group();
                this.group.position.set(0, 0, z);
                this.phase = 0;

                const woodMat = new THREE.MeshStandardMaterial({ color: 0x7c2d12, roughness: 0.7 });
                const ropeMat = new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.5 });
                const poleMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.5, roughness: 0.3 });

                [-5.5, 5.5].forEach(px => {
                    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 2.2, 10), woodMat);
                    post.position.set(px, 1.1, 0);
                    post.castShadow = true;
                    this.group.add(post);
                });

                const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 11.0, 8), ropeMat);
                rope.rotation.z = Math.PI / 2;
                rope.position.y = 1.85;
                this.group.add(rope);

                scene.add(this.group);

                this.walkers = [
                    {
                        ninja: new GooglyNinja({ x: -2.4, y: 1.85, z: z, behavior: 'MOUNTED', scale: 0.95, archetypeKey: archetypeA }),
                        pole: new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 3.4, 8), poleMat),
                        baseX: -2.4,
                        poleReleased: false,
                        offset: 0
                    },
                    {
                        ninja: new GooglyNinja({ x: 2.4, y: 1.85, z: z, behavior: 'MOUNTED', scale: 0.95, archetypeKey: archetypeB }),
                        pole: new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 3.4, 8), poleMat),
                        baseX: 2.4,
                        poleReleased: false,
                        offset: Math.PI
                    }
                ];

                this.walkers.forEach(w => {
                    w.pole.rotation.z = Math.PI / 2;
                    scene.add(w.pole);
                    enemies.push(w.ninja);
                });
                this.update(0);
            }

            update(dt) {
                this.phase += dt * 2.8;
                this.walkers.forEach(w => {
                    const n = w.ninja;
                    if (!n || !n.alive) {
                        if (!w.poleReleased) {
                            w.poleReleased = true;
                            physicsChunks.push({
                                mesh: w.pole,
                                vel: new THREE.Vector3((Math.random() - 0.5) * 4, 3.5, (Math.random() - 0.5) * 4),
                                rotVel: new THREE.Vector3(3, 5, 6),
                                radius: 0.15,
                                bounces: 0,
                                bleedTimer: 0
                            });
                        }
                        return;
                    }

                    const t = this.phase + w.offset;
                    const wx = w.baseX + Math.sin(t * 0.45) * 1.75;
                    const tilt = Math.sin(t * 1.4) * 0.22;

                    n.root.position.set(wx, 1.85, this.group.position.z);
                    n.root.rotation.z = tilt * 0.55;

                    if (n.parts.leftArm) { n.parts.leftArm.rotation.x = -1.1; n.parts.leftArm.rotation.z = 0.35; }
                    if (n.parts.rightArm) { n.parts.rightArm.rotation.x = -1.1; n.parts.rightArm.rotation.z = -0.35; }
                    if (n.parts.leftLeg) n.parts.leftLeg.rotation.x = Math.sin(t * 1.5) * 0.35;
                    if (n.parts.rightLeg) n.parts.rightLeg.rotation.x = -Math.sin(t * 1.5) * 0.35;

                    w.pole.position.set(wx, 3.15, this.group.position.z + 0.42);
                    w.pole.rotation.z = Math.PI / 2 + tilt;
                });
            }

            destroyClean() {
                scene.remove(this.group);
                this.walkers.forEach(w => scene.remove(w.pole));
            }
        }

        class HulaHoopContraption {
            constructor(x, z, archetypeKey, hoopColor = 0xff2e93, phaseOffset = 0) {
                this.phase = phaseOffset;
                this.hoopReleased = false;

                this.hoop = new THREE.Mesh(
                    new THREE.TorusGeometry(0.75, 0.055, 10, 28),
                    new THREE.MeshStandardMaterial({ color: hoopColor, emissive: hoopColor, emissiveIntensity: 0.25, roughness: 0.3 })
                );
                this.hoop.rotation.x = Math.PI / 2;
                scene.add(this.hoop);

                this.dancer = new GooglyNinja({
                    x: x,
                    y: 0,
                    z: z,
                    behavior: 'MOUNTED',
                    speed: 0,
                    scale: 0.98,
                    archetypeKey: archetypeKey
                });
                enemies.push(this.dancer);
                this.update(0);
            }

            update(dt) {
                this.phase += dt * 9.5;
                if (!this.dancer || !this.dancer.alive) {
                    if (!this.hoopReleased) {
                        this.hoopReleased = true;
                        physicsChunks.push({
                            mesh: this.hoop,
                            vel: new THREE.Vector3(Math.cos(this.phase) * 5, 4.0, Math.sin(this.phase) * 5),
                            rotVel: new THREE.Vector3(6, 12, 5),
                            radius: 0.35,
                            bounces: 0,
                            bleedTimer: 0
                        });
                    }
                    return;
                }

                // Realistic circular hip gyration + spinning hula hoop
                const gx = Math.cos(this.phase) * 0.16;
                const gz = Math.sin(this.phase) * 0.16;
                if (this.dancer.parts.pelvis) {
                    this.dancer.parts.pelvis.position.set(gx, 1.12, gz);
                    this.dancer.parts.pelvis.rotation.z = gx * 0.85;
                }
                if (this.dancer.parts.torso) {
                    this.dancer.parts.torso.rotation.z = -gx * 0.65;
                }
                if (this.dancer.parts.leftArm) {
                    this.dancer.parts.leftArm.rotation.z = 1.85 + Math.sin(this.phase * 0.5) * 0.25;
                }
                if (this.dancer.parts.rightArm) {
                    this.dancer.parts.rightArm.rotation.z = -1.85 - Math.sin(this.phase * 0.5) * 0.25;
                }

                this.hoop.position.set(
                    this.dancer.root.position.x + gx * 1.9,
                    1.28,
                    this.dancer.root.position.z + gz * 1.9
                );
                this.hoop.rotation.x = Math.PI / 2 + gz * 0.7;
                this.hoop.rotation.y = gx * 0.7;
            }

            destroyClean() {
                scene.remove(this.hoop);
            }
        }

        /* ============================================================================
         * INTERACTIVE RED & WHITE BARREL + BREAKABLE PHYSICS CRATES
         * ============================================================================ */
        class DojoBarrel {
            constructor(x, z, explosive = false) {
                this.group = new THREE.Group();
                this.group.position.set(x, 0, z);
                this.explosive = explosive;
                this.intact = true;

                const redMat = new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.55 });
                const whiteStripeMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.5 });

                // Bottom red section
                const bot = new THREE.Mesh(new THREE.CylinderGeometry(0.68, 0.65, 0.5, 18), redMat);
                bot.position.y = 0.25;
                bot.castShadow = true;
                this.group.add(bot);

                // Middle white painted band
                const mid = new THREE.Mesh(new THREE.CylinderGeometry(0.71, 0.71, 0.72, 18), whiteStripeMat);
                mid.position.y = 0.86;
                mid.castShadow = true;
                this.group.add(mid);

                // Top red section
                const top = new THREE.Mesh(new THREE.CylinderGeometry(0.66, 0.7, 0.48, 18), redMat);
                top.position.y = 1.46;
                top.castShadow = true;
                this.group.add(top);

                this.group.position.y = 0;
                scene.add(this.group);
            }

            hitByDisc(discPos, discVel) {
                if (!this.intact) return;
                this.intact = false;
                sound.playBarrelSmash();
                cameraShake = 0.35;

                // Spawn flying barrel fragments
                const fragMatRed = new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.6 });
                const fragMatWhite = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.5 });

                for (let i = 0; i < 12; i++) {
                    const stave = new THREE.Mesh(
                        new THREE.BoxGeometry(0.24, 0.75, 0.08),
                        i % 2 === 0 ? fragMatRed : fragMatWhite
                    );
                    const angle = (i / 12) * Math.PI * 2;
                    stave.position.set(
                        this.group.position.x + Math.cos(angle) * 0.5,
                        0.9 + (Math.random() - 0.5) * 0.5,
                        this.group.position.z + Math.sin(angle) * 0.5
                    );
                    stave.castShadow = true;
                    scene.add(stave);

                    physicsChunks.push({
                        mesh: stave,
                        vel: new THREE.Vector3(
                            Math.cos(angle) * 6 + discVel.x * 0.15,
                            4.5 + Math.random() * 4,
                            Math.sin(angle) * 6 + discVel.z * 0.15
                        ),
                        rotVel: new THREE.Vector3(
                            (Math.random() - 0.5) * 15,
                            (Math.random() - 0.5) * 15,
                            (Math.random() - 0.5) * 15
                        ),
                        radius: 0.18,
                        bounces: 0,
                        bleedTimer: 0
                    });
                }

                // If any enemy is standing right behind or next to the barrel, shockwave knock them!
                enemies.forEach(enemy => {
                    if (enemy.alive) {
                        const d = enemy.root.position.distanceTo(this.group.position);
                        if (d < 2.5) {
                            enemy.sliceAt(enemy.root.position.clone().add(new THREE.Vector3(0, 1.5, 0)), discVel);
                        }
                    }
                });

                scene.remove(this.group);
            }

            destroyClean() {
                scene.remove(this.group);
            }
        }

        /* ============================================================================
         * TANDEM BICYCLE CONTRAPTION (Level 11 & Higher Bonus Waves)
         * Two characters sit one behind the other on the same bicycle, pedaling in sync
         * while the bicycle stays stationary in place!
         * ============================================================================ */
        class TandemBicycle {
            constructor(x, z, frontArchetype, rearArchetype, swayMode = false) {
                this.group = new THREE.Group();
                this.group.position.set(x, 0, z);
                this.initialX = x;
                this.initialZ = z;
                this.swayMode = swayMode;
                this.pedalAngle = 0;

                const frameMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.3, metalness: 0.5 });
                const chromeMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.25, metalness: 0.8 });
                const tireMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
                const seatMat = new THREE.MeshStandardMaterial({ color: 0x27272a, roughness: 0.6 });

                // Bicycle faces slightly angled so both front and rear riders are clearly visible & hittable!
                this.bikePivot = new THREE.Group();
                this.bikePivot.rotation.y = 0.38; // ~22 deg diagonal presentation so both riders are exposed
                this.group.add(this.bikePivot);

                // Front & Rear Spinning Wheels (along Z axis of bikePivot)
                this.wheels = [];
                const wheelPositionsZ = [1.35, -1.35];
                wheelPositionsZ.forEach(wz => {
                    const wheelGrp = new THREE.Group();
                    wheelGrp.position.set(0, 0.62, wz);

                    const tire = new THREE.Mesh(new THREE.TorusGeometry(0.56, 0.08, 12, 24), tireMat);
                    tire.rotation.y = Math.PI / 2;
                    tire.castShadow = true;
                    wheelGrp.add(tire);

                    const rim = new THREE.Mesh(new THREE.TorusGeometry(0.48, 0.03, 8, 20), chromeMat);
                    rim.rotation.y = Math.PI / 2;
                    wheelGrp.add(rim);

                    // Spokes
                    for (let s = 0; s < 6; s++) {
                        const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.96, 6), chromeMat);
                        spoke.rotation.x = (s / 6) * Math.PI;
                        wheelGrp.add(spoke);
                    }

                    this.bikePivot.add(wheelGrp);
                    this.wheels.push(wheelGrp);
                });

                // Tandem Horizontal Top Tube & Bottom Tube connecting both wheels
                const topTube = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 2.35, 10), frameMat);
                topTube.rotation.x = Math.PI / 2;
                topTube.position.set(0, 1.05, 0);
                topTube.castShadow = true;
                this.bikePivot.add(topTube);

                const lowerTube = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 2.55, 10), frameMat);
                lowerTube.rotation.x = Math.PI / 2;
                lowerTube.position.set(0, 0.62, 0);
                this.bikePivot.add(lowerTube);

                // Front Fork & Handlebars
                const frontFork = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.04, 1.15, 10), frameMat);
                frontFork.position.set(0, 1.1, 1.25);
                frontFork.rotation.x = -0.18;
                this.bikePivot.add(frontFork);

                const handleBar = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.95, 10), chromeMat);
                handleBar.rotation.z = Math.PI / 2;
                handleBar.position.set(0, 1.65, 1.12);
                this.bikePivot.add(handleBar);

                // Two Saddles & Seat Posts (Front Seat at z = +0.42, Rear Seat at z = -0.78)
                this.crankPivots = [];
                [0.42, -0.78].forEach((sz, idx) => {
                    const seatPost = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.78, 10), chromeMat);
                    seatPost.position.set(0, 0.96, sz);
                    seatPost.rotation.x = -0.15;
                    this.bikePivot.add(seatPost);

                    const saddle = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.1, 0.42), seatMat);
                    saddle.position.set(0, 1.32, sz - 0.05);
                    this.bikePivot.add(saddle);

                    // Secondary rear grip bar for the second rider
                    if (idx === 1) {
                        const rearBar = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.72, 8), chromeMat);
                        rearBar.rotation.z = Math.PI / 2;
                        rearBar.position.set(0, 1.48, sz + 0.55);
                        this.bikePivot.add(rearBar);
                    }

                    // Rotating Pedal Crankset under each rider
                    const crankGrp = new THREE.Group();
                    crankGrp.position.set(0, 0.58, sz + 0.15);

                    const gear = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.05, 14), chromeMat);
                    gear.rotation.z = Math.PI / 2;
                    crankGrp.add(gear);

                    [-1, 1].forEach(side => {
                        const arm = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.28, 0.05), chromeMat);
                        arm.position.set(side * 0.12, side * 0.12, 0);
                        crankGrp.add(arm);

                        const pedal = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.05, 0.12), seatMat);
                        pedal.position.set(side * 0.2, side * 0.24, 0);
                        crankGrp.add(pedal);
                    });

                    this.bikePivot.add(crankGrp);
                    this.crankPivots.push(crankGrp);
                });

                // Stationary Roller Stand underneath wheels so it looks like a Stationary Dojo Exercise Bike!
                const standBase = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.08, 3.3), chromeMat);
                standBase.position.set(0, 0.04, 0);
                standBase.receiveShadow = true;
                this.bikePivot.add(standBase);

                scene.add(this.group);

                // Spawn Front Rider and Rear Rider
                this.frontRider = new GooglyNinja({
                    x: x,
                    y: 0.25,
                    z: z,
                    behavior: 'BIKE_RIDER',
                    speed: 0,
                    scale: 0.96,
                    archetypeKey: frontArchetype
                });
                this.rearRider = new GooglyNinja({
                    x: x,
                    y: 0.25,
                    z: z,
                    behavior: 'BIKE_RIDER',
                    speed: 0,
                    scale: 0.96,
                    archetypeKey: rearArchetype
                });

                enemies.push(this.frontRider, this.rearRider);
                this.updateRiderPositions(0);
            }

            updateRiderPositions(dt) {
                this.pedalAngle += dt * 11.5;

                // Subtle stationary bike vibration & optional side-tilt balance in higher levels
                if (this.swayMode) {
                    this.bikePivot.rotation.y = 0.38 + Math.sin(this.pedalAngle * 0.18) * 0.42;
                    this.bikePivot.rotation.z = Math.sin(this.pedalAngle * 0.36) * 0.1;
                } else {
                    this.bikePivot.rotation.z = Math.sin(this.pedalAngle * 0.5) * 0.035;
                }

                // Spin wheels and pedals rapidly in place!
                this.wheels.forEach(w => {
                    w.rotation.x += dt * 14.0;
                });
                this.crankPivots.forEach(c => {
                    c.rotation.x = this.pedalAngle;
                });

                // Position and animate both riders on their respective saddles in world space
                const riderConfigs = [
                    { rider: this.frontRider, localOffset: new THREE.Vector3(0, 0.22, 0.42), phase: 0 },
                    { rider: this.rearRider, localOffset: new THREE.Vector3(0, 0.22, -0.78), phase: Math.PI * 0.5 }
                ];

                this.group.updateMatrixWorld();

                riderConfigs.forEach(({ rider, localOffset, phase }) => {
                    if (!rider || !rider.alive) return;

                    const worldPos = localOffset.clone().applyMatrix4(this.bikePivot.matrixWorld);
                    const pAngle = this.pedalAngle + phase;
                    const bob = Math.abs(Math.sin(pAngle)) * 0.08;

                    rider.root.position.set(worldPos.x, worldPos.y + bob, worldPos.z);
                    rider.root.rotation.y = this.bikePivot.rotation.y;

                    // Synchronized bicycling leg & arm pose!
                    if (rider.parts.leftLeg) {
                        rider.parts.leftLeg.rotation.x = -0.65 + Math.sin(pAngle) * 0.55;
                    }
                    if (rider.parts.rightLeg) {
                        rider.parts.rightLeg.rotation.x = -0.65 - Math.sin(pAngle) * 0.55;
                    }
                    if (rider.parts.torso) {
                        rider.parts.torso.rotation.x = 0.26 + Math.sin(pAngle * 2) * 0.05;
                    }
                    if (rider.parts.leftArm) {
                        rider.parts.leftArm.rotation.x = -1.05;
                        rider.parts.leftArm.rotation.z = 0.18;
                    }
                    if (rider.parts.rightArm) {
                        rider.parts.rightArm.rotation.x = -1.05;
                        rider.parts.rightArm.rotation.z = -0.18;
                    }
                    if (rider.parts.head) {
                        rider.parts.head.rotation.z = Math.cos(pAngle) * 0.09;
                    }
                });
            }

            update(dt) {
                this.updateRiderPositions(dt);
            }

            destroyClean() {
                scene.remove(this.group);
            }
        }

        /* ============================================================================
         * LEVEL 12+ CONTRAPTIONS: ROTATING WINDMILL WHEEL & TILTING SEESAW
         * ============================================================================ */
        class WindmillWheelContraption {
            constructor(x, z, radius, speed, riderArchetypes) {
                this.group = new THREE.Group();
                this.group.position.set(x, 0, z);
                this.radius = radius;
                this.speed = speed;
                this.angle = 0;

                const woodMat = new THREE.MeshStandardMaterial({ color: 0x9a3412, roughness: 0.6 });
                const goldMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.35, metalness: 0.4 });

                // Support A-Frame Pillars
                const hubY = radius + 1.35;
                this.hubY = hubY;
                [-0.85, 0.85].forEach(pz => {
                    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.26, hubY + 0.5, 10), woodMat);
                    post.position.set(0, (hubY + 0.5) / 2, pz);
                    post.castShadow = true;
                    this.group.add(post);
                });

                this.wheelPivot = new THREE.Group();
                this.wheelPivot.position.set(0, hubY, 0);
                this.group.add(this.wheelPivot);

                const outerRing = new THREE.Mesh(new THREE.TorusGeometry(radius, 0.14, 12, 32), goldMat);
                outerRing.castShadow = true;
                this.wheelPivot.add(outerRing);

                const count = riderArchetypes.length;
                this.seats = [];

                for (let i = 0; i < count; i++) {
                    const spokeAngle = (i / count) * Math.PI * 2;
                    const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, radius * 2, 8), woodMat);
                    spoke.rotation.z = spokeAngle;
                    this.wheelPivot.add(spoke);

                    const plat = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.18, 1.1), goldMat);
                    plat.castShadow = true;
                    this.group.add(plat);

                    const rider = new GooglyNinja({
                        x: x,
                        y: 0,
                        z: z,
                        behavior: 'MOUNTED',
                        speed: 0,
                        scale: 0.92,
                        archetypeKey: riderArchetypes[i]
                    });
                    enemies.push(rider);

                    this.seats.push({ baseAngle: spokeAngle, platform: plat, rider });
                }

                scene.add(this.group);
                this.update(0);
            }

            update(dt) {
                this.angle += this.speed * dt;
                this.wheelPivot.rotation.z = this.angle;

                this.seats.forEach((seat, idx) => {
                    const a = this.angle + seat.baseAngle;
                    const sx = Math.cos(a) * this.radius;
                    const sy = this.hubY + Math.sin(a) * this.radius;

                    seat.platform.position.set(sx, sy, 0);

                    if (seat.rider && seat.rider.alive) {
                        seat.rider.root.position.set(
                            this.group.position.x + sx,
                            sy + 0.09,
                            this.group.position.z
                        );
                        // Cheerful balancing wave pose
                        const wave = Math.sin(this.angle * 3 + idx);
                        if (seat.rider.parts.leftArm) seat.rider.parts.leftArm.rotation.z = 0.6 + wave * 0.4;
                        if (seat.rider.parts.rightArm) seat.rider.parts.rightArm.rotation.z = -0.6 - wave * 0.4;
                    }
                });
            }

            destroyClean() {
                scene.remove(this.group);
            }
        }

        class SeesawContraption {
            constructor(x, z, leftArch, rightArch, speed = 2.4) {
                this.group = new THREE.Group();
                this.group.position.set(x, 0, z);
                this.phase = 0;
                this.speed = speed;

                const fulcrumMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.5 });
                const plankMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.5 });

                const fulcrum = new THREE.Mesh(new THREE.ConeGeometry(0.85, 1.3, 4), fulcrumMat);
                fulcrum.position.y = 0.65;
                fulcrum.rotation.y = Math.PI / 4;
                fulcrum.castShadow = true;
                this.group.add(fulcrum);

                this.beam = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.22, 1.2), plankMat);
                this.beam.position.y = 1.3;
                this.beam.castShadow = true;
                this.group.add(this.beam);

                scene.add(this.group);

                this.leftRider = new GooglyNinja({
                    x: x - 2.6,
                    y: 1.4,
                    z: z,
                    behavior: 'MOUNTED',
                    scale: 0.95,
                    archetypeKey: leftArch
                });
                this.rightRider = new GooglyNinja({
                    x: x + 2.6,
                    y: 1.4,
                    z: z,
                    behavior: 'MOUNTED',
                    scale: 0.95,
                    archetypeKey: rightArch
                });
                enemies.push(this.leftRider, this.rightRider);
                this.update(0);
            }

            update(dt) {
                this.phase += dt * this.speed;
                const tilt = Math.sin(this.phase) * 0.36;
                this.beam.rotation.z = tilt;

                const span = 2.6;
                if (this.leftRider && this.leftRider.alive) {
                    const lx = -Math.cos(tilt) * span;
                    const ly = 1.3 + Math.sin(-tilt) * span;
                    this.leftRider.root.position.set(this.group.position.x + lx, ly + 0.1, this.group.position.z);
                }
                if (this.rightRider && this.rightRider.alive) {
                    const rx = Math.cos(tilt) * span;
                    const ry = 1.3 + Math.sin(tilt) * span;
                    this.rightRider.root.position.set(this.group.position.x + rx, ry + 0.1, this.group.position.z);
                }
            }

            destroyClean() {
                scene.remove(this.group);
            }
        }

        /* ============================================================================
         * GREEN SPLATTER PARTICLES, FLOOR PUDDLES & RAGDOLL CHUNKS
         * ============================================================================ */
        let enemies = [];
        let barrels = [];
        let crates = [];
        let contraptions = [];
        let activeDiscs = [];
        let physicsChunks = [];
        let splatterParticles = [];
        let floorPuddles = [];

        const greenGooMat = new THREE.MeshStandardMaterial({
            color: 0x35f024,
            roughness: 0.25,
            emissive: 0x16a34a,
            emissiveIntensity: 0.22
        });

        function spawnGreenSplatter(origin, count = 32, customMat = greenGooMat) {
            for (let i = 0; i < count; i++) {
                const size = 0.07 + Math.random() * 0.14;
                const drop = new THREE.Mesh(new THREE.SphereGeometry(size, 7, 7), customMat);
                drop.position.copy(origin);
                scene.add(drop);

                const theta = Math.random() * Math.PI * 2;
                const speed = 2.0 + Math.random() * 8.5;
                splatterParticles.push({
                    mesh: drop,
                    vel: new THREE.Vector3(
                        Math.cos(theta) * speed,
                        2.5 + Math.random() * 6.5,
                        Math.sin(theta) * speed
                    ),
                    size: size,
                    mat: customMat
                });
            }
        }

        function spawnFloorPuddle(x, z, baseRadius = 1.1, customMat = greenGooMat) {
            const puddleGroup = new THREE.Group();
            const blobCount = 4 + Math.floor(Math.random() * 4);
            for (let i = 0; i < blobCount; i++) {
                const r = (0.35 + Math.random() * 0.55) * baseRadius;
                const blob = new THREE.Mesh(new THREE.CircleGeometry(r, 14), customMat);
                blob.rotation.x = -Math.PI / 2;
                blob.position.set(
                    (Math.random() - 0.5) * baseRadius * 1.1,
                    0.015 + Math.random() * 0.01,
                    (Math.random() - 0.5) * baseRadius * 1.1
                );
                puddleGroup.add(blob);
            }
            puddleGroup.position.set(x, 0, z);
            puddleGroup.scale.setScalar(0.1);
            scene.add(puddleGroup);
            floorPuddles.push({ mesh: puddleGroup, targetScale: 1.0 });
        }

        function spawnFloatingText(worldPos, text) {
            const projected = worldPos.clone().project(camera);
            const sx = (projected.x * 0.5 + 0.5) * window.innerWidth;
            const sy = (-projected.y * 0.5 + 0.5) * window.innerHeight;

            const el = document.createElement('div');
            el.className = 'hit-popup';
            el.style.left = `${sx}px`;
            el.style.top = `${sy}px`;
            el.textContent = text;
            document.getElementById('floating-fx-container').appendChild(el);
            setTimeout(() => el.remove(), 900);
        }

        /* ============================================================================
         * THROWN DISC & GUN BULLET PROJECTILE CLASS
         * ============================================================================ */
        class ThrownDisc {
            constructor(startPos, velocity, curveAccelX, mode, isBullet = false) {
                this.mode = mode;
                this.isBullet = isBullet;
                this.group = new THREE.Group();
                this.group.position.copy(startPos);
                this.vel = velocity.clone();
                this.curveAccelX = isBullet ? 0 : curveAccelX;
                this.radius = isBullet ? 0.42 : mode.radius;
                this.age = 0;
                this.active = true;

                if (isBullet) {
                    // Sleek high-caliber golden tracer bullet
                    const brassMat = new THREE.MeshStandardMaterial({
                        color: 0xfacc15,
                        emissive: 0xf59e0b,
                        emissiveIntensity: 0.65,
                        metalness: 0.8,
                        roughness: 0.15
                    });
                    const slug = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.14, 0.65, 12), brassMat);
                    slug.rotation.x = Math.PI / 2;
                    this.group.add(slug);

                    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.3, 12), brassMat);
                    tip.rotation.x = -Math.PI / 2;
                    tip.position.z = -0.45;
                    this.group.add(tip);

                    this.group.lookAt(startPos.clone().add(velocity));
                } else {
                    // Outer glowing rim
                    const outerGeo = new THREE.CylinderGeometry(mode.radius, mode.radius, 0.09, 24);
                    const outerMat = new THREE.MeshStandardMaterial({
                        color: mode.color,
                        emissive: mode.color,
                        emissiveIntensity: 0.35,
                        metalness: 0.6,
                        roughness: 0.2
                    });
                    const discBody = new THREE.Mesh(outerGeo, outerMat);
                    discBody.castShadow = true;
                    this.group.add(discBody);

                    // Inner metallic core ring
                    const coreGeo = new THREE.CylinderGeometry(mode.radius * 0.55, mode.radius * 0.55, 0.13, 20);
                    const coreMat = new THREE.MeshStandardMaterial({ color: mode.rimColor, roughness: 0.3 });
                    this.group.add(new THREE.Mesh(coreGeo, coreMat));

                    // Saw teeth / ninja blades around edge
                    const bladeCount = 8;
                    for (let i = 0; i < bladeCount; i++) {
                        const ang = (i / bladeCount) * Math.PI * 2;
                        const tooth = new THREE.Mesh(
                            new THREE.ConeGeometry(0.16, 0.35, 4),
                            coreMat
                        );
                        tooth.rotation.z = -Math.PI / 2;
                        tooth.rotation.y = ang;
                        tooth.position.set(Math.cos(ang) * mode.radius, 0, Math.sin(ang) * mode.radius);
                        this.group.add(tooth);
                    }

                    // Slight bank tilt based on curve
                    this.group.rotation.z = THREE.MathUtils.clamp(-curveAccelX * 0.025, -0.45, 0.45);
                }

                scene.add(this.group);
                this.trailMeshes = [];
            }

            update(dt) {
                if (!this.active) return;
                this.age += dt;

                // Apply horizontal spin curve & subtle gravity drop far away
                this.vel.x += this.curveAccelX * dt;
                this.vel.y -= (this.isBullet ? 0.25 : 1.8) * dt;

                // Sub-step movement for accurate collision detection
                const steps = this.isBullet ? 5 : 3;
                const stepDt = dt / steps;
                for (let s = 0; s < steps; s++) {
                    this.group.position.addScaledVector(this.vel, stepDt);
                    this.checkCollisions();
                    if (!this.active) break;
                }

                if (!this.isBullet) {
                    this.group.rotation.y += 32 * dt;
                }

                // Spawn subtle ribbon trail ghost
                if (Math.random() < 0.75) {
                    const ghost = new THREE.Mesh(
                        this.isBullet
                            ? new THREE.SphereGeometry(0.12, 8, 8)
                            : new THREE.RingGeometry(this.radius * 0.5, this.radius * 0.92, 16),
                        new THREE.MeshBasicMaterial({
                            color: this.isBullet ? 0xfef08a : this.mode.color,
                            transparent: true,
                            opacity: 0.5,
                            side: THREE.DoubleSide
                        })
                    );
                    if (!this.isBullet) ghost.rotation.x = Math.PI / 2;
                    ghost.position.copy(this.group.position);
                    scene.add(ghost);
                    this.trailMeshes.push({ mesh: ghost, alpha: 0.5 });
                }

                // Out of bounds cleanup
                if (
                    this.age > 3.2 ||
                    this.group.position.z < -26 ||
                    this.group.position.y < 0.08 ||
                    Math.abs(this.group.position.x) > 22
                ) {
                    this.deactivate();
                }
            }

            checkCollisions() {
                const pos = this.group.position;

                // 1. Check collision against Barrels
                for (let i = 0; i < barrels.length; i++) {
                    const b = barrels[i];
                    if (!b.intact) continue;
                    const dx = pos.x - b.group.position.x;
                    const dz = pos.z - b.group.position.z;
                    const horizDist = Math.hypot(dx, dz);
                    if (horizDist < this.radius + 0.68 && pos.y >= 0 && pos.y <= 1.95) {
                        b.hitByDisc(pos, this.vel);
                        if (this.mode.id !== 'GIANT') {
                            this.vel.multiplyScalar(0.84);
                        }
                    }
                }

                // 1b. Check collision against Green Brick Wells (Level 2+ Contraption)
                for (let i = 0; i < contraptions.length; i++) {
                    const con = contraptions[i];
                    if (con instanceof BrickWellContraption && con.wellIntact) {
                        const dx = pos.x - con.group.position.x;
                        const dz = pos.z - con.group.position.z;
                        const horizDist = Math.hypot(dx, dz);
                        if (horizDist < this.radius + 0.92 && pos.y >= 0.05 && pos.y <= 1.62) {
                            con.smashWell(this.vel);
                            spawnFloatingText(pos.clone(), 'WELL SMASHED!');
                            if (this.mode.id !== 'GIANT' && !this.isBullet) {
                                this.vel.multiplyScalar(0.75);
                            }
                        }
                    }
                }

                // 2. Check collision against Breakable Physics Crates
                for (let i = 0; i < crates.length; i++) {
                    const c = crates[i];
                    if (!c.intact) continue;
                    const dx = pos.x - c.mesh.position.x;
                    const dz = pos.z - c.mesh.position.z;
                    const dy = Math.abs(pos.y - c.mesh.position.y);
                    if (Math.hypot(dx, dz) < this.radius + 0.65 && dy < 0.75) {
                        c.hitByDisc(this.vel);
                        if (this.mode.id !== 'GIANT') {
                            this.vel.multiplyScalar(0.85);
                        }
                    }
                }

                // 3. Check collision against Enemies (with Shield Ricochet & Hit Zone detection)
                for (let i = 0; i < enemies.length; i++) {
                    const e = enemies[i];
                    if (!e.alive) continue;

                    const ex = e.root.position.x;
                    const ey = e.root.position.y;
                    const ez = e.root.position.z;
                    const dx = pos.x - ex;
                    const dz = pos.z - ez;
                    const horizDist = Math.hypot(dx, dz);
                    const hitWidth = (0.72 * e.scale) + this.radius;
                    const minHeight = ey + 0.05;
                    const maxHeight = ey + 2.95 * e.scale;

                    if (horizDist <= hitWidth && pos.y >= minHeight && pos.y <= maxHeight) {
                        // Check if Shield Samurai blocks a direct front-left chest hit (unless Giant disc, curved angle, or Armor-Piercing Bullet!)
                        const relY = (pos.y - ey) / e.scale;
                        if (
                            e.hasShield &&
                            !this.isBullet &&
                            this.mode.id !== 'GIANT' &&
                            relY > 0.9 &&
                            relY < 2.1 &&
                            dx < 0.15 &&
                            Math.abs(this.vel.x) < 11
                        ) {
                            // Knock the shield off on first impact so the player can either curve around or break through!
                            e.hasShield = false;
                            if (e.shieldMesh && e.shieldMesh.parent) {
                                const shieldWorld = new THREE.Vector3();
                                e.shieldMesh.getWorldPosition(shieldWorld);
                                scene.attach(e.shieldMesh);
                                e.shieldMesh.position.copy(shieldWorld);
                                physicsChunks.push({
                                    mesh: e.shieldMesh,
                                    vel: new THREE.Vector3(this.vel.x * 0.25 - 4, 5.5, 4),
                                    rotVel: new THREE.Vector3(8, 12, -9),
                                    radius: 0.3,
                                    bounces: 0,
                                    bleedTimer: 0
                                });
                            }
                            sound.playRicochet();
                            spawnFloatingText(pos.clone(), 'SHIELD BROKEN!');
                            // Ricochet the disc
                            this.vel.z = Math.abs(this.vel.z) * 0.65;
                            this.vel.x += (Math.random() - 0.5) * 14;
                            return;
                        }

                        const hitZone = relY > 2.15 ? 'HEAD' : (relY < 1.05 ? 'LEGS' : 'BODY');
                        e.sliceAt(pos.clone(), this.vel, hitZone);
                        if (this.isBullet) {
                            this.deactivate();
                            return;
                        }
                    }
                }
            }

            deactivate() {
                this.active = false;
                scene.remove(this.group);
            }

            updateTrail(dt) {
                for (let i = this.trailMeshes.length - 1; i >= 0; i--) {
                    const t = this.trailMeshes[i];
                    t.alpha -= dt * 2.4;
                    if (t.alpha <= 0) {
                        scene.remove(t.mesh);
                        this.trailMeshes.splice(i, 1);
                    } else {
                        t.mesh.material.opacity = t.alpha;
                        t.mesh.scale.multiplyScalar(0.96);
                    }
                }
            }

            destroyClean() {
                scene.remove(this.group);
                this.trailMeshes.forEach(t => scene.remove(t.mesh));
                this.trailMeshes = [];
            }
        }

        /* ============================================================================
         * PLAYER READY DISC / 3D GUN MODEL & AIMING TRAJECTORY PREVIEW
         * ============================================================================ */
        const readyDiscGroup = new THREE.Group();
        const readyDiscPosition = new THREE.Vector3(0, 1.85, 10.6);

        function rebuildReadyDiscMesh() {

                barrel.position.set(0, 0.12, -0.25);
                gunGrp.add(barrel);

                const topRail = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.08, 1.05), accentMat);
                topRail.position.set(0, 0.28, -0.22);
                gunGrp.add(topRail);

                const muzzle = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.25, 14), accentMat);
                muzzle.rotation.x = Math.PI / 2;

                const grip = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.55, 0.28), gripMat);

                muzzleFlashMesh.position.set(0, 0.12, -1.15);
                muzzleFlashMesh.visible = false;
                gunGrp.add(muzzleFlashMesh);

                readyDiscGroup.add(gunGrp);
                readyDiscGroup.rotation.set(0, 0, 0);
            } else {

                const outer = new THREE.Mesh(
                    new THREE.CylinderGeometry(mode.radius * 0.75, mode.radius * 0.75, 0.08, 24),

                const inner = new THREE.Mesh(

                    new THREE.MeshStandardMaterial({ color: mode.rimColor, roughness: 0.3 })

                readyDiscGroup.add(inner);
            }
        }
        rebuildReadyDiscMesh();

        // Dotted Trajectory Preview Dots
        const trajectoryGroup = new THREE.Group();
        scene.add(trajectoryGroup);
        const trajectoryDots = [];

        for (let i = 0; i < NUM_TRAJ_DOTS; i++) {

                new THREE.SphereGeometry(0.13 * (1 - i / (NUM_TRAJ_DOTS * 1.3)), 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 - (i / NUM_TRAJ_DOTS) * 0.65 })
            );
            dot.visible = false;
            trajectoryGroup.add(dot);
            trajectoryDots.push(dot);

        function getPairArchetypes(levelNum, offset = 0) {
            const k1 = ALL_ARCHETYPE_KEYS[(levelNum * 2 + offset) % ALL_ARCHETYPE_KEYS.length];
