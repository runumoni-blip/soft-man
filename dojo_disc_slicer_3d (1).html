                } else if (mod === 3) {
                    subtitleEl.textContent = `Level ${levelNum}: Revolving Windmill + Golden Pot Balancers!`;
                    contraptions.push(new WindmillWheelContraption(0, -4.8, 2.9, 1.75, [arch1, arch2, arch3]));
                    enemies.push(new GooglyNinja({ x: -2.6, z: -2.5, behavior: 'GOLDEN_POT_BALANCE_WALK', speed: 1.5, archetypeKey: 'POT_BALANCER' }));
                    enemies.push(new GooglyNinja({ x: 2.6, z: -2.5, behavior: 'GOLDEN_POT_BALANCE_WALK', speed: 1.5, archetypeKey: 'POT_BALANCER' }));
                } else if (mod === 4) {
                    subtitleEl.textContent = `Level ${levelNum}: Seesaw Acrobatics + Royal Helmet Kata!`;
                    contraptions.push(new SeesawContraption(0, -4.2, arch1, arch3, 2.9));
                    enemies.push(new GooglyNinja({ x: -2.6, z: -2.6, behavior: 'ROYAL_HELMET_KATA', speed: 1.6, archetypeKey: 'GOLDEN_HELMET' }));
                    enemies.push(new GooglyNinja({ x: 2.6, z: -2.6, behavior: 'FLORAL_DRESS_TWIRL', speed: 1.6, archetypeKey: 'FLORAL_DRESS' }));
                } else {
                    subtitleEl.textContent = `Level ${levelNum}: Trampoline + Weightlifting + Moonwalk Trio!`;
                    contraptions.push(new TrampolineContraption(-2.5, -3.6, arch1, 0));
                    contraptions.push(new WeightliftingContraption(2.5, -3.6, arch2, 1.5));
                    enemies.push(new GooglyNinja({ x: 0, z: -2.6, behavior: 'MOONWALK_BREAKDANCE', speed: 1.8, archetypeKey: 'ORANGE_HEART_BRO' }));
                }
            }

            updateTargetsLeftHUD();
        }

        function updateTargetsLeftHUD() {
            const remaining = enemies.filter(e => e.alive).length;
            const el = document.getElementById('targets-left');
            if (el) el.textContent = remaining;
        }

        function checkLevelCompletion() {
            updateTargetsLeftHUD();
            if (gameState !== 'PLAYING') return;
            const remaining = enemies.filter(e => e.alive).length;
            if (remaining === 0) {
                gameState = 'LEVEL_COMPLETE';
                setTimeout(() => {
                    sound.playVictory();
                    const modal = document.getElementById('level-complete-modal');
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                }, 650);
            }
        }

        function updateScoreHUD() {
            document.getElementById('score-counter').textContent = totalKills;
        }

        /* ============================================================================
         * INPUT CONTROLS (Soft, responsive aiming via Drag OR Direct Tap/Click)
         * ============================================================================ */
        let isAiming = false;
        let aimStartScreen = { x: 0, y: 0 };
        let aimCurrentScreen = { x: 0, y: 0 };
        const raycaster = new THREE.Raycaster();
        const aimPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 2.5); // Virtual target plane at z = -2.5

        function screenToTargetWorld(clientX, clientY) {
            const ndcX = (clientX / window.innerWidth) * 2 - 1;
            const ndcY = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);

            const intersectPt = new THREE.Vector3();
            raycaster.ray.intersectPlane(aimPlane, intersectPt);
            if (!intersectPt) {
                intersectPt.set(ndcX * 8, 1.6, -3);
            }
            // Clamp height so throws stay at a sweet chest/head slicing level!
            intersectPt.x = THREE.MathUtils.clamp(intersectPt.x, -8.5, 8.5);
            intersectPt.y = THREE.MathUtils.clamp(intersectPt.y, 0.75, 2.65);
            return intersectPt;
        }

        function computeThrowVectors(clientX, clientY) {
            const mode = DISC_MODES[currentDiscModeIndex];
            const targetPt = screenToTargetWorld(clientX, clientY);

            if (isGunMode) {
                const dir = new THREE.Vector3().subVectors(targetPt, readyDiscPosition).normalize();
                const velocity = dir.multiplyScalar(78); // High-speed bullet velocity
                return { velocity, curveAccelX: 0 };
            }

            // Calculate horizontal drag offset for optional curve spin
            const dragDX = (clientX - aimStartScreen.x) / window.innerWidth;
            const curveAccelX = -dragDX * 18.0 * mode.curveFactor;

            const dir = new THREE.Vector3().subVectors(targetPt, readyDiscPosition).normalize();
            const velocity = dir.multiplyScalar(mode.speed);
            // Compensate slightly for gravity over flight time
            velocity.y += 0.55;

            return { velocity, curveAccelX };
        }

        function updateTrajectoryPreview(clientX, clientY) {
            const { velocity, curveAccelX } = computeThrowVectors(clientX, clientY);
            const grav = isGunMode ? 0.25 : 1.8;
            const stepT = isGunMode ? 0.014 : 0.025;
            for (let i = 0; i < NUM_TRAJ_DOTS; i++) {
                const t = (i + 1) * stepT;
                const px = readyDiscPosition.x + velocity.x * t + 0.5 * curveAccelX * t * t;
                const py = Math.max(0.15, readyDiscPosition.y + velocity.y * t - 0.5 * grav * t * t);
                const pz = readyDiscPosition.z + velocity.z * t;

                trajectoryDots[i].position.set(px, py, pz);
                trajectoryDots[i].material.color.setHex(isGunMode ? 0xfef08a : 0xffffff);
                trajectoryDots[i].visible = true;
            }
        }

        function hideTrajectoryPreview() {
            trajectoryDots.forEach(d => (d.visible = false));
        }

        function launchDisc(clientX, clientY) {
            if (gameState !== 'PLAYING') return;

            const mode = DISC_MODES[currentDiscModeIndex];
            const { velocity, curveAccelX } = computeThrowVectors(clientX, clientY);

            if (isGunMode) {
                sound.playGunshot();
                activeDiscs.push(new ThrownDisc(readyDiscPosition, velocity, 0, mode, true));
                // Gun recoil & muzzle flash
                readyDiscGroup.position.z = readyDiscPosition.z + 0.45;
                readyDiscGroup.rotation.x = 0.32;
                if (muzzleFlashMesh) {
                    muzzleFlashMesh.visible = true;
                    muzzleFlashTimer = 0.07;
                }
                cameraShake = 0.14;
                return;
            }

            sound.playThrow();

            if (mode.count === 1) {
                activeDiscs.push(new ThrownDisc(readyDiscPosition, velocity, curveAccelX, mode, false));
            } else {
                // Triple fan spread
                [-0.14, 0, 0.14].forEach(angleOffset => {
                    const spreadVel = velocity.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), angleOffset);
                    activeDiscs.push(new ThrownDisc(readyDiscPosition, spreadVel, curveAccelX, mode, false));
                });
            }

            // Brief visual recoil on ready disc
            readyDiscGroup.scale.setScalar(0.25);
        }

        // Pointer Down / Move / Up Listeners
        canvas.addEventListener('pointerdown', e => {
            if (gameState !== 'PLAYING') return;
            isAiming = true;
            aimStartScreen = { x: e.clientX, y: e.clientY };
            aimCurrentScreen = { x: e.clientX, y: e.clientY };
            updateTrajectoryPreview(e.clientX, e.clientY);
        });

        window.addEventListener('pointermove', e => {
            // Subtle parallax camera sway on pointer movement
            const nx = (e.clientX / window.innerWidth - 0.5) * 2;
            const ny = (e.clientY / window.innerHeight - 0.5) * 2;
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, baseCamPos.x + nx * 0.55, 0.08);
            camera.position.y = THREE.MathUtils.lerp(camera.position.y, baseCamPos.y - ny * 0.25, 0.08);

            if (isGunMode) {
                const targetPt = screenToTargetWorld(e.clientX, e.clientY);
                readyDiscGroup.lookAt(targetPt);
            }

            if (!isAiming) return;
            aimCurrentScreen = { x: e.clientX, y: e.clientY };
            updateTrajectoryPreview(e.clientX, e.clientY);
        });

        window.addEventListener('pointerup', e => {
            if (!isAiming) return;
            isAiming = false;
            hideTrajectoryPreview();
            launchDisc(e.clientX, e.clientY);
        });

        /* ============================================================================
         * UI BUTTON HANDLERS
         * ============================================================================ */
        document.getElementById('btn-restart-top').addEventListener('click', () => {
            loadLevel(currentLevel);
        });

        document.getElementById('btn-prev-level').addEventListener('click', () => {
            currentLevel = Math.max(1, currentLevel - 1);
            loadLevel(currentLevel);
        });

        document.getElementById('btn-next-level').addEventListener('click', () => {
            currentLevel++;
            loadLevel(currentLevel);
        });

        document.getElementById('btn-jump-11').addEventListener('click', () => {
            currentLevel = 11;
            loadLevel(currentLevel);
        });

        document.getElementById('btn-jump-12').addEventListener('click', () => {
            currentLevel = 12;
            loadLevel(currentLevel);
        });

        document.querySelectorAll('.btn-level-jump').forEach(btn => {
            btn.addEventListener('click', () => {
                const targetLv = parseInt(btn.getAttribute('data-jump-level'), 10);
                if (!isNaN(targetLv)) {
                    currentLevel = targetLv;
                    loadLevel(currentLevel);
                }
            });
        });

        document.getElementById('btn-again').addEventListener('click', () => {
            loadLevel(currentLevel);
        });

        document.getElementById('btn-continue').addEventListener('click', () => {
            currentLevel++;
            loadLevel(currentLevel);
        });

        function updateWeaponHUDText() {
            const mode = DISC_MODES[currentDiscModeIndex];
            const weaponBadge = document.getElementById('weapon-mode-badge');
            if (isGunMode) {
                weaponBadge.textContent = 'GUN';
                weaponBadge.className = 'absolute -top-2 -right-2 bg-emerald-400 text-slate-900 text-[10px] font-extrabold px-1.5 py-0.5 rounded-full border border-slate-900 shadow';
                document.getElementById('disc-mode-title').textContent = 'Dojo Blaster Gun (Active)';
                document.getElementById('disc-mode-desc').textContent = 'High-velocity armor-piercing bullets!';
            } else {
                weaponBadge.textContent = 'DISC';
                weaponBadge.className = 'absolute -top-2 -right-2 bg-rose-500 text-white text-[10px] font-extrabold px-1.5 py-0.5 rounded-full border border-slate-900 shadow';
                document.getElementById('disc-mode-title').textContent = `${mode.name} (Disc Mode)`;
                document.getElementById('disc-mode-desc').textContent = mode.desc;
            }
        }

        document.getElementById('btn-weapon-gun').addEventListener('click', () => {
            isGunMode = !isGunMode;
            updateWeaponHUDText();
            rebuildReadyDiscMesh();
            if (isGunMode) {
                sound.playGunshot();
            } else {
                sound.playThrow();
            }
        });

        document.getElementById('btn-mute').addEventListener('click', () => {
            sound.muted = !sound.muted;
            document.getElementById('icon-sound-on').classList.toggle('hidden', sound.muted);
            document.getElementById('icon-sound-off').classList.toggle('hidden', !sound.muted);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        /* ============================================================================
         * MAIN PHYSICS & RENDER LOOP
         * ============================================================================ */
        let lastTime = performance.now();

        function animate(now) {
            requestAnimationFrame(animate);

            const rawDt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            // Handle impact slow-motion
            if (slowMoTimer > 0) {
                slowMoTimer -= rawDt;
                if (slowMoTimer <= 0) slowMoFactor = 1.0;
            }
            const dt = rawDt * slowMoFactor;

            // Handle camera shake
            if (cameraShake > 0) {
                cameraShake = Math.max(0, cameraShake - rawDt * 1.8);
                camera.position.x += (Math.random() - 0.5) * cameraShake;
                camera.position.y += (Math.random() - 0.5) * cameraShake;
            } else {
                camera.position.lerp(baseCamPos, 0.08);
            }

            // Animate player's ready disc or 3D gun in foreground
            if (isGunMode) {
                readyDiscGroup.position.lerp(readyDiscPosition, 0.2);
                readyDiscGroup.rotation.x = THREE.MathUtils.lerp(readyDiscGroup.rotation.x, 0, 0.2);
                if (muzzleFlashTimer > 0) {
                    muzzleFlashTimer -= rawDt;
                    if (muzzleFlashTimer <= 0 && muzzleFlashMesh) {
                        muzzleFlashMesh.visible = false;
                    }
                }
            } else {
                readyDiscGroup.position.copy(readyDiscPosition);
                readyDiscGroup.rotation.set(0, readyDiscGroup.rotation.y + rawDt * 8.5, 0);
            }
            readyDiscGroup.scale.lerp(new THREE.Vector3(1, 1, 1), 0.15);

            // Animate ambient falling sakura petals / snow / embers
            ambientPetals.forEach(p => {
                p.phase += rawDt * 2.2;
                p.mesh.position.y -= p.speedY * rawDt;
                p.mesh.position.x += Math.sin(p.phase) * p.driftX * rawDt;
                p.mesh.rotation.x += rawDt * 1.8;
                p.mesh.rotation.y += rawDt * 2.4;
                if (p.mesh.position.y < 0.1) {
                    p.mesh.position.y = 12.5;
                    p.mesh.position.x = (Math.random() - 0.5) * 32;
                }
            });
            // 1. Update Contraptions (Tandem Bicycles, Windmill Wheels, Seesaws) & Enemies
            contraptions.forEach(con => con.update(dt));
            enemies.forEach(enemy => enemy.update(dt));

            // 2. Update Active Thrown Discs
            for (let i = activeDiscs.length - 1; i >= 0; i--) {
                const d = activeDiscs[i];
                d.update(dt);
                d.updateTrail(rawDt);
                if (!d.active && d.trailMeshes.length === 0) {
                    activeDiscs.splice(i, 1);
                }
            }

            // 3. Update Severed Ragdoll Body Parts & Barrel Fragments Physics
            const gravity = 22.0;
            for (let i = physicsChunks.length - 1; i >= 0; i--) {
                const c = physicsChunks[i];
                c.vel.y -= gravity * dt;
                c.mesh.position.addScaledVector(c.vel, dt);

                c.mesh.rotation.x += c.rotVel.x * dt;
                c.mesh.rotation.y += c.rotVel.y * dt;
                c.mesh.rotation.z += c.rotVel.z * dt;

                // Drip extra green goo while airborne right after slice
                if (c.bleedTimer > 0) {
                    c.bleedTimer -= dt;
                    if (Math.random() < 0.35) {
                        spawnGreenSplatter(c.mesh.position, 1, c.gooMat || greenGooMat);
                    }
                }

                // Domino Physics: Flying ragdoll torsos or crate planks can knock into nearby live enemies!
                if (c.canKnockEnemies && c.bounces === 0 && c.vel.lengthSq() > 18) {
                    enemies.forEach(enemy => {
                        if (enemy.alive) {
                            const d = enemy.root.position.clone().add(new THREE.Vector3(0, 1.4, 0)).distanceTo(c.mesh.position);
                            if (d < 0.95) {
                                enemy.sliceAt(c.mesh.position.clone(), c.vel, 'BODY');
                            }
                        }
                    });
                }

                // Floor bounce and friction
                if (c.mesh.position.y < c.radius) {
                    c.mesh.position.y = c.radius;
                    c.vel.y = Math.abs(c.vel.y) * 0.42;
                    c.vel.x *= 0.72;
                    c.vel.z *= 0.72;
                    c.rotVel.multiplyScalar(0.68);
                    c.bounces++;
                    if (c.bounces === 1 && c.bleedTimer > 0) {
                        spawnFloorPuddle(c.mesh.position.x, c.mesh.position.z, 0.55, c.gooMat || greenGooMat);
                    }
                }
            }

            // 4. Update Airborne Splatter Droplets
            for (let i = splatterParticles.length - 1; i >= 0; i--) {
                const p = splatterParticles[i];
                p.vel.y -= 24.0 * dt;
                p.mesh.position.addScaledVector(p.vel, dt);

                if (p.mesh.position.y <= 0.04) {
                    const dot = new THREE.Mesh(new THREE.CircleGeometry(p.size * 1.7, 8), p.mat || greenGooMat);
                    dot.rotation.x = -Math.PI / 2;
                    dot.position.set(p.mesh.position.x, 0.014, p.mesh.position.z);
                    scene.add(dot);
                    floorPuddles.push({ mesh: dot, targetScale: 1.0 });

                    scene.remove(p.mesh);
                    splatterParticles.splice(i, 1);
                }
            }

            // 5. Smoothly expand floor puddles
            floorPuddles.forEach(fp => {
                fp.mesh.scale.lerp(new THREE.Vector3(fp.targetScale, fp.targetScale, fp.targetScale), 0.18);
            });

            renderer.render(scene, camera);
        }

        window.onload = function () {
            loadLevel(1);
            lastTime = performance.now();
            animate(lastTime);
        };
    </script>
</body>
</html>
